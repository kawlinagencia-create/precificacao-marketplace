      lucroBox.style.background=bg;
    }
  };
  input.addEventListener('input',atualizarAoVivo);

  const finalizar=async(salvar)=>{
    input.removeEventListener('input',atualizarAoVivo);
    if(salvar){
      const novoValor=parseFloat(input.value)||0;
      await saveInlineEditPrecoTeste(pid,cid,plat,kitQty,novoValor);
    }else{
      renderTab();
    }
  };
  input.addEventListener('blur',()=>finalizar(true));
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();input.blur();}
    if(e.key==='Escape'){e.preventDefault();input.removeEventListener('blur',()=>finalizar(true));finalizar(false);}
  });
}
async function saveInlineEditPrecoTeste(pid,cid,plat,kitQty,novoValor){
  const cli=ST.clients.find(c=>String(c.id)===String(cid));
  const p=cli?.produtos?.find(x=>String(x.id)===String(pid));
  if(!p)return;
  const k=p.kits.find(x=>x.qty===kitQty);
  if(!k)return;
  // Preço teste é só uma calculadora salva — não gera registro de histórico
  if(!k.precos_teste)k.precos_teste={};
  k.precos_teste[plat]=novoValor||null;
  try{
    const pay={client_id:cli.id,sku:p.sku,nome:p.nome,fabricacao:p.fabricacao||false,plataformas:p.plataformas,kits:p.kits,foto_url:p.foto_url||null,links:p.links||{},custo_unidade:p.custo_unidade||null};
    const{error}=await sb.from('prec_products').update(pay).eq('id',p.id);
    if(error)throw new Error(error.message);
    toast('✅ Preço teste salvo!');
  }catch(err){
    console.error('Erro ao salvar preço teste:',err);
    toast('⚠️ ERRO ao salvar: '+(err.message||'falha desconhecida'),'error');
  }
  renderTab();
}

// Quando o item cruza uma fronteira, fica na faixa mais próxima (equilibra pra cima ou pra baixo,
// em vez de sempre empurrar o item inteiro pra faixa de cima). Item gigante que cruza as duas
// fronteiras de uma vez sempre fica em A (é claramente o campeão de vendas).
function classificarCurva(pctAntes,pctDepois){
  if(pctAntes>=95) return 'C';
  if(pctAntes>=80){
    if(pctDepois<=95) return 'B';
    return(pctDepois-95)<=(95-pctAntes)?'B':'C';
  }
  if(pctDepois<=80) return 'A';
  if(pctDepois<=95) return(pctDepois-80)<=(80-pctAntes)?'A':'B';
  return 'A';
}

async function consultarCurvaABC(){
  const c=gc();if(!c)return;
  CABC.loading=true;CABC.dados=[];
  // Invalida o cache usado pela aba Produtos — o formato aqui é diferente (agregado só por SKU,
  // sem separar por quantidade de kit), então a próxima visita à aba Produtos precisa recarregar
  CABC.clienteCarregado=null;
  renderTab();
  let q=sb.from('prec_curva_abc').select('*').eq('client_id',c.id).order('pct_acumulado');
  if(CABC.plat&&CABC.plat!=='todos'){
    if(CABC.plat==='ml') q=q.in('plataforma',['ml_classico','ml_premium','ml']);
    else q=q.eq('plataforma',CABC.plat);
  }
  const{data,error}=await q;
  if(error){toast('Erro ao consultar dados','error');console.error(error);}
  else if(data?.length){
    const map={};
    for(const d of data){
      const k=(d.sku||d.nome_produto);
      if(!map[k]){map[k]={...d,pedidos:0,unidades:0,faturamento:0};}
      map[k].pedidos+=d.pedidos;
      map[k].unidades+=d.unidades;
      map[k].faturamento+=d.faturamento;
    }
    let prods=Object.values(map).sort((a,b)=>b.faturamento-a.faturamento);
    const tot=prods.reduce((s,p)=>s+p.faturamento,0);let acum=0;
    CABC.dados=prods.map(p=>{
      const pctAntes=tot>0?acum/tot*100:0;
      acum+=p.faturamento;
      const pct=tot>0?p.faturamento/tot*100:0;
      const pctA=tot>0?acum/tot*100:0;
      return{...p,pct_faturamento:pct,pct_acumulado:pctA,curva:classificarCurva(pctAntes,pctA)};
    });
  }else{CABC.dados=[];}
  CABC.loading=false;renderTab();
}

async function processarCurvaABC(input){
  const file=input.files[0];if(!file)return;
  const c=gc();if(!c)return;
  const hoje=new Date();
  const ano=hoje.getFullYear();
  const mes=hoje.getMonth()+1;
  const plat=document.getElementById('abc-upload-plat')?.value||'todos';
  CABC.uploading=true;renderTab();
  try{
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    const header=rows[0].map(h=>String(h||'').toLowerCase().trim());
    // Detectar colunas pelo nome — formato UpSeller "Vendas por Produtos"
    const iCol=header.findIndex(h=>h.includes('produto'));
    const lojaCol=header.findIndex(h=>h.includes('loja'));
    const skuPrincipalCol=header.findIndex(h=>h.includes('sku principal'));
    const skuVarianteCol=header.findIndex(h=>h==='sku'||h==='sku da variante'||h==='skus');
    const idAnuncioCol=header.findIndex(h=>h.includes('id do anún')||h.includes('id anún')||h.includes('id do anuncio')||h.includes('id anuncio'));
    const pedCol=header.findIndex(h=>h.includes('pedido'));
    const unidCol=header.findIndex(h=>h.includes('unidade')||h.includes('volume de venda'));
    const fatCol=header.findIndex(h=>h.includes('pagamento')||h.includes('faturamento')||h.includes('receita')||h.includes('valor de venda')||h.includes('valor total')||(h.includes('valor')&&!h.includes('médio')&&!h.includes('medio')));
    const precoCol=header.findIndex(h=>h.includes('médio')||h.includes('medio'));
    // Quando a plataforma selecionada é "Mercado Livre" (unificada), cada linha diz se é Clássico ou Premium
    const isMLUnificado=plat==='ml';
    const tipoAnuncioCol=isMLUnificado?header.findIndex(h=>h.includes('tipo de anúncio')||h.includes('tipo de anuncio')):-1;
    if(iCol<0||(skuPrincipalCol<0&&skuVarianteCol<0)){
      CABC.uploading=false;
      toast('Formato não reconhecido. Use o extrato "Vendas por Produtos" do UpSeller.','error');
      renderTab();return;
    }
    // Agrupar por SKU (código + quantidade do kit) — soma os tamanhos (G/M/GG/P) juntos,
    // mas mantém quantidades de kit diferentes (3KIT029 x 5KIT029) em linhas separadas
    // Extrai {codigo, qty} de uma SKU de variante, reconhecendo os formatos:
    //  A) qty ANTES de KIT, sem separador (ex: "5KIT029-G")      -> qty=5, codigo=029
    //  B) codigo ANTES de KIT, com separador (ex: "123-KIT10-G") -> codigo=123, qty=10
    //  C) sem "KIT" nenhum = peça avulsa/K1 (ex: "319-CHO-G")     -> codigo=319, qty=1
    function parseSkuVarianteABC(skuVarRaw){
      let m=skuVarRaw.match(/^(\d+)KIT-?(\d+)/i);
      if(m) return{codigo:m[2],qty:parseInt(m[1])};
      m=skuVarRaw.match(/^(\d+)-?KIT-?(\d+)/i);
      if(m) return{codigo:m[1],qty:parseInt(m[2])};
      // Padrão combo: código-(cores e quantidades)-tamanho -> soma a quantidade de cada parte.
      // Cobre: "672-PRE+CHO-XG" (2 cores, 1 cada), "672-2CHO-XG" (2 do mesmo tom),
      // "672- 1 PRE + 1 CHO-GG" (quantidade explícita por cor, com espaços)
      let mCombo=skuVarRaw.match(/^(\d+)-(.+)-[A-Z0-9]+$/i);
      if(mCombo&&/[A-ZÀ-Ü]/i.test(mCombo[2])){
        const partes=mCombo[2].split(/\s*\+\s*/);
        let qty=0,temCor=false;
        for(const parte of partes){
          const mp=parte.trim().match(/^(\d+)?\s*([A-ZÀ-Ü].*)$/i);
          if(mp){qty+=mp[1]?parseInt(mp[1]):1;temCor=true;}
        }
        if(temCor&&qty>0) return{codigo:mCombo[1],qty};
      }
      m=skuVarRaw.match(/^(\d+)/);
      if(m) return{codigo:m[1],qty:1,ambiguo:true};
      return null;
    }
    const map={};
    for(let i=1;i<rows.length;i++){
      const row=rows[i];
      if(!row||!row[iCol])continue;
      const nome=(row[iCol]||'').toString().trim();
      const loja=(row[lojaCol]||'').toString().replace(/\[.*?\]/g,'').trim();
      const skuPrincipal=(row[skuPrincipalCol]||'').toString().trim();
      const skuVariante=(skuVarianteCol>=0?(row[skuVarianteCol]||''):'').toString().trim();
      const idAnuncio=(idAnuncioCol>=0?(row[idAnuncioCol]||''):'').toString().trim();
      const ped=parseFloat(row[pedCol])||0;
      const unid=parseFloat(row[unidCol])||0;
      const fat=parseFloat(row[fatCol])||0;
      const preco=parseFloat(row[precoCol])||0;
      // Preferir a SKU da variante (dá pra distinguir a quantidade do kit).
      // Sem essa coluna, cai no SKU Principal (comportamento antigo, sem distinguir kit)
      let skuBase,kitQty=null;
      const parsed=skuVariante?parseSkuVarianteABC(skuVariante):null;
      if(parsed){
        kitQty=parsed.qty;
        // SKU sem info de kit (ex: "025-G", só o código) — reforça buscando "Kit N" no nome do produto
        if(parsed.ambiguo){
          const mNome=nome.match(/\bKIT\s*(?:COM\s*)?(\d+)\b/i);
          if(mNome) kitQty=parseInt(mNome[1]);
        }
        skuBase=`${kitQty}KIT${parsed.codigo}`.toUpperCase();
      }else{
        skuBase=skuPrincipal;
        const m1=skuPrincipal.match(/KIT-?(\d+)/i);
        if(m1)skuBase=m1[1];
        const m2=skuPrincipal.match(/^(\d+)KIT/i);
        if(m2)kitQty=parseInt(m2[1]);
      }
      const key=skuBase||nome;
      if(!map[key]){map[key]={sku:skuBase,nome,lojas:new Set(),anuncios:new Set(),ped:0,unid:0,fat:0,preco:0,n:0,kits:{},platFat:{}};}
      // Somar pedidos, unidades e faturamento de todos os tamanhos/anúncios do mesmo SKU+kit
      map[key].ped+=ped;
      map[key].unid+=unid;
      map[key].fat+=fat;
      map[key].preco+=preco;
      map[key].n++;
      if(loja)map[key].lojas.add(loja);
      if(idAnuncio)map[key].anuncios.add(idAnuncio);
      // No modo ML unificado, guardar por Tipo de Anúncio pra saber depois se esse SKU é
      // majoritariamente Clássico ou Premium (evita salvar como "ml" genérico, que não bate
      // com o SKU cadastrado — os produtos usam ml_classico/ml_premium especificamente)
      if(isMLUnificado){
        const tipoTxt=String(row[tipoAnuncioCol]||'').toLowerCase().trim();
        const platLinha=tipoTxt.includes('premium')?'ml_premium':'ml_classico';
        map[key].platFat[platLinha]=(map[key].platFat[platLinha]||0)+fat;
      }
      // Acumular por kit
      if(kitQty){
        if(!map[key].kits[kitQty])map[key].kits[kitQty]={qty:kitQty,ped:0,unid:0,fat:0};
        map[key].kits[kitQty].ped+=ped;
        map[key].kits[kitQty].unid+=unid;
        map[key].kits[kitQty].fat+=fat;
      }
    }
    let prods=Object.values(map).sort((a,b)=>b.fat-a.fat);
    const totalFat=prods.reduce((s,p)=>s+p.fat,0);
    let acum=0;
    const registros=prods.map(p=>{
      const pctAntes=totalFat>0?acum/totalFat*100:0;
      acum+=p.fat;
      const pct=totalFat>0?p.fat/totalFat*100:0;
      const pctA=totalFat>0?acum/totalFat*100:0;
      const kitsArr=Object.values(p.kits).sort((a,b)=>b.fat-a.fat);
      // Resolver a plataforma real desse SKU: no modo ML unificado, usa a que tem mais faturamento
      let plataformaLinha=plat;
      if(isMLUnificado){
        const entradas=Object.entries(p.platFat||{});
        plataformaLinha=entradas.length?entradas.sort((a,b)=>b[1]-a[1])[0][0]:'ml_classico';
      }
      // Classificação ABC sempre pela regra da própria Config (80% acumulado = A, até 95% = B, resto = C)
      const curvaFinal=classificarCurva(pctAntes,pctA);
      return{
        client_id:c.id,ano,mes,plataforma:plataformaLinha,
        sku:p.sku||null,
        nome_produto:p.nome,
        lojas:[...p.lojas].join(', '),
        ids_anuncios:[...p.anuncios].join(', '),
        pedidos:p.ped,
        unidades:p.unid,
        faturamento:p.fat,
        preco_medio:p.n>0?p.preco/p.n:0,
        curva:curvaFinal,
        pct_faturamento:pct,
        pct_acumulado:pctA,
        kits_json:kitsArr.length?JSON.stringify(kitsArr):null
      };
    });
    if(isMLUnificado){
      // Substitui qualquer dado anterior das duas variantes de ML — não acumula mais por período,
      // cada importação é o retrato atual daquela plataforma
      await sb.from('prec_curva_abc').delete().eq('client_id',c.id).eq('plataforma','ml_classico');
      await sb.from('prec_curva_abc').delete().eq('client_id',c.id).eq('plataforma','ml_premium');
      await sb.from('prec_curva_abc').delete().eq('client_id',c.id).eq('plataforma','ml');
    }else{
      // Substitui qualquer dado anterior dessa plataforma — não acumula mais por período
      await sb.from('prec_curva_abc').delete().eq('client_id',c.id).eq('plataforma',plat);
    }
    for(let i=0;i<registros.length;i+=100){
      const{error}=await sb.from('prec_curva_abc').insert(registros.slice(i,i+100));
      if(error)throw error;
    }
    toast('✅ '+registros.length+' produtos importados');
    CABC.plat=plat;
    await consultarCurvaABC();
  }catch(e){console.error(e);toast('⚠️ Erro: '+e.message,'error');}
  CABC.uploading=false;renderTab();
}

async function carregarCurvaParaProdutos(){
  const c=gc();if(!c)return;
  // Sempre recarrega do banco (sem cache) — garante que nunca fica um dado desatualizado
  // na memória depois de visitar a aba Curva ABC (que usa um formato agregado diferente)
  const{data,error}=await sb.from('prec_curva_abc')
    .select('sku,nome_produto,faturamento,plataforma')
    .eq('client_id',c.id);
  if(error){console.error('Erro ao buscar curva ABC:',error);CABC.dados=[];return;}
  if(!data?.length){CABC.dados=[];CABC.clienteCarregado=c.id;return;}
  // Agrupar por plataforma — cada plataforma tem seu próprio ranking e sua própria classificação A/B/C,
  // pois um produto pode ser o carro-chefe no Shopee mas irrelevante no Shein, por exemplo
  const porPlat={};
  for(const d of data){
    const plat=d.plataforma||'';
    if(!porPlat[plat]) porPlat[plat]={};
    const key=(d.sku||d.nome_produto||'').trim().toUpperCase();
    if(!key) continue;
    if(!porPlat[plat][key]) porPlat[plat][key]={sku:d.sku,nome_produto:d.nome_produto,plataforma:plat,faturamento:0};
    porPlat[plat][key].faturamento+=d.faturamento||0;
  }
  const resultado=[];
  for(const plat in porPlat){
    const prods=Object.values(porPlat[plat]).sort((a,b)=>b.faturamento-a.faturamento);
    const tot=prods.reduce((s,p)=>s+p.faturamento,0);
    let acum=0;
    for(const p of prods){
      const pctAntes=tot>0?acum/tot*100:0;
      acum+=p.faturamento;
      const pctA=tot>0?acum/tot*100:0;
      resultado.push({...p,pct_acumulado:pctA,curva:classificarCurva(pctAntes,pctA)});
    }
  }
  CABC.dados=resultado;
  CABC.clienteCarregado=c.id;
}

async function atualizarPrecosPorExtrato(input){
  const file=input.files[0];if(!file)return;
  const c=gc();if(!c)return;
  const platId=document.getElementById('preco-upload-plat')?.value||'shopee';
  const isMLUnificado=platId==='ml';
  const platLabel=isMLUnificado?'Mercado Livre':(PLATS.find(p=>p.id===platId)?.label||platId);
  toast(`Lendo extrato da ${platLabel}...`);
  try{
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1});
    const header=rows[0].map(h=>String(h||'').toLowerCase().trim());
    const tipoAnuncioCol=isMLUnificado?header.findIndex(h=>h.includes('tipo de anúncio')||h.includes('tipo de anuncio')):-1;
    if(isMLUnificado&&tipoAnuncioCol<0){toast('Coluna "Tipo de Anúncio" não encontrada no extrato — não dá pra separar Clássico/Premium.','error');return;}

    // Detectar colunas
    const nomeCol=header.findIndex(h=>h.includes('produto'));
    const skuPrincipalCol=header.findIndex(h=>h.includes('sku principal'));
    const skuVarianteCol=header.findIndex(h=>h==='sku'||h==='sku da variante'||h==='skus');
    // Priorizar "Preço com Desconto" — é o preço real praticado
    let precoCol=header.findIndex(h=>h.includes('desconto')||h.includes('promocional')||h.includes('especial'));
    // Coluna do preço cheio, usada como fallback quando a linha não tem promocional/desconto preenchido
    const precoBaseCol=header.findIndex(h=>h==='preço'||h==='preco'||(h.includes('preço')&&!h.includes('desconto')&&!h.includes('promocional')&&!h.includes('especial')));
    if(precoCol<0) precoCol=precoBaseCol;

    if(precoCol<0){toast('Coluna de Preço não encontrada no extrato.','error');return;}

    // Converte texto de preço (ex: "R$ 109.99", "R$1.234,56") para número
    function parsePrecoCel(v){
      if(v==null||v==='')return NaN;
      if(typeof v==='number')return v;
      let s=String(v).replace(/r\$\s*/gi,'').trim();
      if(!s)return NaN;
      if(/,\d{1,2}$/.test(s)&&!/\.\d{1,2}$/.test(s)){s=s.replace(/\./g,'').replace(',','.');}
      else{s=s.replace(/,/g,'');}
      return parseFloat(s);
    }

    // Extrai {codigo, qty} de uma SKU de variante, reconhecendo os formatos:
    //  A) qty ANTES de KIT, sem separador (ex: "10KIT028-P")      -> qty=10, codigo=028
    //  B) codigo ANTES de KIT, com separador (ex: "123-KIT10-G")  -> codigo=123, qty=10
    //  C) sem "KIT" nenhum = peça avulsa/K1 (ex: "319-CHO-G")      -> codigo=319, qty=1
    function parseSkuVariante(skuVarRaw){
      let m=skuVarRaw.match(/^(\d+)KIT-?(\d+)/i);
      if(m) return{codigo:m[2],qty:parseInt(m[1])};
      m=skuVarRaw.match(/^(\d+)-?KIT-?(\d+)/i);
      if(m) return{codigo:m[1],qty:parseInt(m[2])};
      // Padrão combo: código-(cores e quantidades)-tamanho -> soma a quantidade de cada parte
      let mCombo=skuVarRaw.match(/^(\d+)-(.+)-[A-Z0-9]+$/i);
      if(mCombo&&/[A-ZÀ-Ü]/i.test(mCombo[2])){
        const partes=mCombo[2].split(/\s*\+\s*/);
        let qty=0,temCor=false;
        for(const parte of partes){
          const mp=parte.trim().match(/^(\d+)?\s*([A-ZÀ-Ü].*)$/i);
          if(mp){qty+=mp[1]?parseInt(mp[1]):1;temCor=true;}
        }
        if(temCor&&qty>0) return{codigo:mCombo[1],qty};
      }
      m=skuVarRaw.match(/^(\d+)/);
      if(m) return{codigo:m[1],qty:1,ambiguo:true};
      return null;
    }

    // mapaPrecos: { SKU_PRODUTO: { qty: preco } }
    const mapaPrecos={};
    let skuProdutoAtual='';

    for(let i=1;i<rows.length;i++){
      const row=rows[i];
      if(!row||row.every(v=>v==null||v===''))continue;

      let qty=null;
      // SKU Principal — só presente na primeira linha do anúncio (formato Shopee)
      const skuPrincipal=skuPrincipalCol>=0&&row[skuPrincipalCol]?String(row[skuPrincipalCol]).trim():'';
      if(skuPrincipal) skuProdutoAtual=skuPrincipal;
      // Fallback: sem coluna SKU Principal (formato TikTok/ML) — deriva código+qty direto da SKU da variante
      if(skuVarianteCol>=0&&row[skuVarianteCol]){
        const skuVarRaw=String(row[skuVarianteCol]).trim();
        const parsed=parseSkuVariante(skuVarRaw);
        if(parsed){
          qty=parsed.qty;
          // SKU sem info de kit (ex: "025-G") — reforça buscando "Kit N" no nome do produto
          if(parsed.ambiguo&&nomeCol>=0&&row[nomeCol]){
            const mNome=String(row[nomeCol]).match(/\bKIT\s*(?:COM\s*)?(\d+)\b/i);
            if(mNome) qty=parseInt(mNome[1]);
          }
          if(!skuPrincipal) skuProdutoAtual=qty+'KIT'+parsed.codigo;
        }
      }
      if(!skuProdutoAtual)continue;

      let preco=parsePrecoCel(row[precoCol]);
      if((isNaN(preco)||preco<=0)&&precoBaseCol>=0&&precoBaseCol!==precoCol){
        preco=parsePrecoCel(row[precoBaseCol]);
      }
      if(isNaN(preco)||preco<=0)continue;

      // Fallback: tentar extrair kit do SKU principal quando a variante não deu certo
      if(!qty&&skuProdutoAtual){
        const m=skuProdutoAtual.match(/^(\d+)KIT/i);
        if(m) qty=parseInt(m[1]);
      }

      if(!qty)continue;

      // No modo ML unificado, cada linha diz se é Clássico ou Premium
      let platIdLinha=platId;
      if(isMLUnificado){
        const tipoTxt=String(row[tipoAnuncioCol]||'').toLowerCase().trim();
        platIdLinha=tipoTxt.includes('premium')?'ml_premium':'ml_classico';
      }

      // Normalizar o SKU do produto: remover o prefixo de quantidade se existir
      // Ex: "KIT028" é o SKU cadastrado; o SKU Principal no extrato também é "KIT028"
      const skuNorm=skuProdutoAtual.toUpperCase();
      if(!mapaPrecos[skuNorm])mapaPrecos[skuNorm]={};
      if(!mapaPrecos[skuNorm][qty])mapaPrecos[skuNorm][qty]={preco,platId:platIdLinha}; // usa primeiro preço do kit
    }

    if(!Object.keys(mapaPrecos).length){
      toast('Nenhum kit encontrado no extrato. Verifique se os SKUs das variantes seguem o padrão (ex: 10KIT028-P).','error');
      return;
    }

    let atualizados=0,naoEncontrados=[];
    for(const [skuExtrato,kitPrecos] of Object.entries(mapaPrecos)){
      // Buscar produto pelo SKU — comparação flexível
      const prod=c.produtos.find(p=>{
        if(!p.sku)return false;
        const skuProd=p.sku.trim().toUpperCase();
        const skuProdSemZero=skuProd.replace(/^0+/,'');
        const skuExt=skuExtrato.toUpperCase();
        // Extrair só os números do SKU do extrato: KIT028->028, KIT-008->008, 5KIT302->302
        const mExt=skuExt.match(/KIT-?(\d+)/i);
        const skuExtNum=mExt?mExt[1]:skuExt;
        const skuExtNumSemZero=skuExtNum.replace(/^0+/,'');
        // Bate direto
        if(skuProd===skuExt)return true;
        // Compara números sem zeros à esquerda
        if(skuExtNumSemZero===skuProdSemZero)return true;
        if(skuExtNum===skuProd)return true;
        return false;
      });
      if(!prod){naoEncontrados.push(skuExtrato);continue;}

      const snapAntigo=JSON.parse(JSON.stringify(prod));
      let mudou=false;
      for(const kit of(prod.kits||[])){
        if(kitPrecos[kit.qty]!==undefined){
          if(!kit.precos)kit.precos={};
          kit.precos[kitPrecos[kit.qty].platId]=kitPrecos[kit.qty].preco;
          mudou=true;
        }
      }
      if(mudou){
        try{
          await saveProduct(prod,c.id,snapAntigo);
          atualizados++;
        }catch(e){console.error('Erro ao salvar',skuExtrato,e);}
      }
    }

    input.value='';
    const totalSkus=Object.keys(mapaPrecos).length;
    let msg=`✅ ${atualizados} de ${totalSkus} produto(s) atualizados na ${platLabel}!`;
    if(naoEncontrados.length>0) msg+=` · Não encontrados: ${naoEncontrados.slice(0,8).join(', ')}`;
    toast(msg);
    renderTab();
  }catch(e){console.error(e);toast('Erro ao processar extrato: '+e.message,'error');}
}

function getDashRows(){

  const mlTipo=(pl)=>pl==='ml_classico'?'Clássico':pl==='ml_premium'?'Premium':null;
  return all.map(x=>{

    const tipo=mlTipo(x.pl);
    return{
      'SKU':x.p.sku||'—',
      'Produto':x.p.nome,
      'Plataforma':platLabel(x.pl)+(tipo?' ('+tipo+')':''),
      'Kit':x.k.qty,
      'Tipo':x.p.fabricacao?'Fabricação':'Revenda',
      'Preço Atual':x.r.preco,
      'Preço Ideal':ideal?ideal.preco:null,
      '% Ideal':ideal?parseFloat(ideal.margemPerc.toFixed(1)):null,
      'Custo':x.r.custo,
      'Total Taxas':x.r.tax,
      'Lucro R$':x.r.lucro,
      'Lucro %':parseFloat(x.r.margem.toFixed(2)),
      'R$/Peça':parseFloat((x.r.lucro/x.k.qty).toFixed(2)),
      'Status':x.cor==='g'?'Verde':x.r.lucro<0?'Vermelho (prejuízo)':'Vermelho',
    };
  });
}

function getDashKPIs(){
  const c=gc();if(!c)return null;
  const all=applyFilter(allRes(c));
  const base=all.length?all:allRes(c);
  const total=base.length;
  const verm=base.filter(x=>x.cor==='r').length;
  const grn=base.filter(x=>x.cor==='g').length;
  const avgM=base.length?base.reduce((s,x)=>s+x.r.margem,0)/base.length:0;
  const prej=base.filter(x=>x.r.lucro<0).length;
  const totalFat=base.reduce((s,x)=>s+x.r.preco,0);
  return{total,verm,grn,avgM,prej,produtos:c.produtos.length};
}

function exportDashExcel(){
  const c=gc();if(!c)return;
  const rows=getDashRows();
  const kpis=getDashKPIs();
  if(!rows.length){toast('Nenhum dado para exportar','error');return;}
  const wb=XLSX.utils.book_new();
  // Aba Resumo
  const resumoData=[
    ['Relatório de Precificação — '+c.name],
    ['Gerado em: '+new Date().toLocaleDateString('pt-BR')],
    [],
    ['RESUMO'],
    ['Margem Média',kpis.avgM.toFixed(1)+'%'],
    ['No Verde',kpis.grn+' combinações'],
    ['Oportunidades de ajuste',kpis.verm+' combinações'],
    ['Total Combinações',kpis.total],
    ['Total Produtos',kpis.produtos],
  ];
  const wsResumo=XLSX.utils.aoa_to_sheet(resumoData);
  wsResumo['!cols']=[{wch:22},{wch:20}];
  XLSX.utils.book_append_sheet(wb,wsResumo,'Resumo');
  // Aba Detalhado
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:8},{wch:32},{wch:18},{wch:5},{wch:12},{wch:13},{wch:13},{wch:8},{wch:10},{wch:12},{wch:10},{wch:10},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,'Detalhado');
  const nome=c.name.replace(/[^a-z0-9]/gi,'_');
  const data=new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
  XLSX.writeFile(wb,`Relatorio_${nome}_${data}.xlsx`);
  toast('✅ Excel exportado com 2 abas: Resumo e Detalhado!');
}

// Seleção de linha ao clicar — igual Excel
document.addEventListener('click',function(e){
  const tr=e.target.closest('.data-table tbody tr');
  if(!tr) return;
  const table=tr.closest('table');
  const wasSelected=tr.classList.contains('selected');
  table.querySelectorAll('tbody tr.selected').forEach(r=>r.classList.remove('selected'));
  if(!wasSelected) tr.classList.add('selected');
});
