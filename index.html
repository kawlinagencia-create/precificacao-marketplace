<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Precificação — Agência</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f7f7f5;--surface:#fff;--surface2:#f0f0ec;--border:#e5e5e0;--border2:#d0d0c8;--text:#1a1a18;--text2:#6b6b65;--text3:#9b9b94;--accent:#2d6a4f;--accent-bg:#e8f5ee;--accent-text:#1b4332;--danger:#c1121f;--danger-bg:#fee2e2;--warn:#d97706;--warn-bg:#fef3c7;--orange:#c05621;--orange-bg:#fff0e6;--success:#166534;--success-bg:#dcfce7;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--r:8px;--r-lg:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sb-logo-title{font-size:13px;font-weight:600}
.sb-logo-sub{font-size:11px;color:var(--text3);margin-top:1px}
.sb-section{padding:10px 8px 4px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.sb-list{flex:1;overflow-y:auto;padding:4px 8px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;margin-bottom:1px}
.sb-item:hover{background:var(--surface2);color:var(--text)}
.sb-item.active{background:var(--accent-bg);color:var(--accent-text);font-weight:500}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-count{margin-left:auto;font-size:10px;background:var(--surface2);color:var(--text3);padding:1px 6px;border-radius:20px}
.sb-item.active .sb-count{background:var(--accent);color:#fff}
.sb-footer{padding:8px;border-top:1px solid var(--border)}
.sb-add-btn{display:flex;align-items:center;gap:6px;width:100%;padding:8px 10px;border-radius:var(--r);border:1px dashed var(--border2);background:transparent;color:var(--text3);font-size:12px;cursor:pointer;transition:all .15s;font-family:var(--font)}
.sb-add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;height:52px;gap:12px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:10px;flex:1}
.topbar-title{font-size:15px;font-weight:600}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-gray{background:var(--surface2);color:var(--text3)}
.tabs{display:flex;gap:1px;background:var(--surface2);padding:3px;border-radius:var(--r);border:1px solid var(--border)}
.tab-btn{padding:5px 11px;font-size:12px;border-radius:6px;cursor:pointer;color:var(--text2);border:none;background:transparent;font-family:var(--font);transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.content{flex:1;overflow-y:auto;padding:20px}
.search-wrap{position:relative;margin-bottom:12px}
.search-input{width:100%;padding:9px 36px 9px 36px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}
.search-icon-left{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:15px}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;font-size:14px}
.scope-row{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.scope-btn{padding:4px 10px;font-size:11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .15s}
.scope-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
.prod-card{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:8px;background:var(--surface)}
.prod-card-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:12px}
.prod-card-head:hover{background:var(--surface2)}
.prod-card-name{font-size:13px;font-weight:600}
.prod-card-meta{font-size:11px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prod-card-body{border-top:1px solid var(--border);padding:14px 16px;background:var(--surface2);display:none}
.prod-card-body.open{display:block}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{text-align:left;padding:7px 10px;color:var(--text3);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap}
.data-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr.selected td{background:#dbeafe!important;outline:2px solid #3b82f6;outline-offset:-1px}
.data-table tbody tr{cursor:pointer}
.data-table td.mono{font-family:var(--mono);font-size:11px}
.chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500;margin:1px;white-space:nowrap}
.chip-shopee{background:#fee2d5;color:#9d2a0a}
.chip-shein{background:#d1fae5;color:#065f46}
.chip-ml{background:#fef9c3;color:#713f12}
.chip-tiktok{background:#f1f5f9;color:#334155}
.chip-custom{background:#ede9fe;color:#5b21b6}
.chip-kit{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.lv{display:inline-flex;align-items:center;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap;font-family:var(--mono)}
.lv-g{background:var(--success-bg);color:var(--success)}
.lv-a{background:var(--warn-bg);color:var(--warn)}
.lv-l{background:var(--orange-bg);color:var(--orange)}
.lv-r{background:var(--danger-bg);color:var(--danger)}
mark{background:#fef08a;border-radius:2px;padding:0 1px;color:inherit}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.kpi-label{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500}
.kpi-val{font-size:22px;font-weight:600;font-family:var(--mono)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:3px}
.kpi.danger .kpi-val{color:var(--danger)}
.kpi.success .kpi-val{color:var(--success)}
.kpi.warn .kpi-val{color:var(--warn)}
.bar-wrap{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:11px}
.bar-label{width:150px;flex-shrink:0;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:12px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-val{width:70px;text-align:right;font-weight:600;font-family:var(--mono);font-size:11px}
.sec{margin-bottom:22px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-title{font-size:13px;font-weight:600}
.sec-line{flex:1;height:1px;background:var(--border)}
.alert-list{display:flex;flex-direction:column;gap:6px}
.alert-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--r-lg);border:1px solid}
.alert-item.red{border-color:#fca5a5;background:#fff5f5}
.alert-item.orange{border-color:#fdba74;background:#fff7ed}
.alert-item.yellow{border-color:#fcd34d;background:#fffbeb}
.taxas-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.taxa-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px}
.taxa-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.taxa-row:last-child{border-bottom:none}
.taxa-input{width:65px;padding:3px 7px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);text-align:right;font-family:var(--mono);outline:none}
.taxa-input:focus{border-color:var(--accent)}
.taxa-name-input{flex:1;padding:3px 7px;font-size:12px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text);font-family:var(--font);outline:none}
.taxa-name-input:hover{border-color:var(--border);background:var(--surface2)}
.taxa-name-input:focus{border-color:var(--accent);background:var(--surface)}
.taxa-add-row{display:flex;align-items:center;gap:6px;margin-top:8px}
.taxa-add-input{flex:1;padding:5px 8px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-family:var(--font);outline:none}
.calc-wrap{display:grid;grid-template-columns:320px 1fr;gap:16px;max-width:920px}
.calc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.calc-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.calc-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid var(--border)}
.calc-row:last-child{border-bottom:none}
.calc-row.total{font-weight:700;font-size:13px}
.calc-val{font-family:var(--mono);font-weight:600}
.calc-input{padding:6px 10px;font-size:13px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font);outline:none;text-align:right;width:130px}
.calc-input:focus{border-color:var(--accent);background:var(--surface)}
.calc-select{padding:6px 10px;font-size:13px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font);outline:none;width:130px}
.taxa-detail-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px;border-bottom:1px dashed var(--border)}
.taxa-detail-row:last-child{border-bottom:none}
.sugestao-box{background:var(--accent-bg);border-radius:var(--r);padding:12px;margin-top:10px}
.sugestao-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);width:620px;max-width:96vw;max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:15px;font-weight:600}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.05em}
.form-input{width:100%;padding:8px 10px;font-size:13px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kit-block{background:var(--surface2);border-radius:var(--r);padding:12px;margin-bottom:8px;border:1px solid var(--border)}
/* Tooltip */
.tip-wrap{position:relative;display:inline-block;cursor:help}
.tip-wrap .tip{display:none;position:fixed;background:var(--text);color:#fff;border-radius:var(--r);padding:8px 10px;font-size:11px;white-space:nowrap;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);min-width:200px;pointer-events:none}
.tip-wrap:hover .tip{display:block}
.tip-row{display:flex;justify-content:space-between;gap:16px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.tip-row:last-child{border-bottom:none;font-weight:700;margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.25)}
/* Lucro preview no kit */
.lucro-preview{margin-top:8px;padding:8px 10px;border-radius:var(--r);font-size:12px;border:1px solid var(--border)}
.lucro-preview.pos{background:var(--success-bg);border-color:#86efac;color:var(--success)}
.lucro-preview.neg{background:var(--danger-bg);border-color:#fca5a5;color:var(--danger)}
.lucro-preview.neu{background:var(--surface2);color:var(--text3)}
.preco-inline-display:hover{background:var(--accent-bg);color:var(--accent-text);border-bottom-color:var(--accent)}
.preco-inline-input{width:80px;padding:2px 5px;font-size:11px;font-family:var(--mono);font-weight:600;border:1px solid var(--accent);border-radius:4px;outline:none;text-align:right}
.plat-checks{display:flex;flex-wrap:wrap;gap:6px}
.plat-cb{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:12px;user-select:none;transition:all .15s;background:var(--surface)}
.plat-cb.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text);font-weight:500}
.tgl-group{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;width:fit-content}
.tgl-btn{padding:7px 14px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:var(--font);transition:all .15s;border-right:1px solid var(--border)}
.tgl-btn:last-child{border-right:none}
.tgl-btn.on{background:var(--text);color:#fff;font-weight:500}
.divider{height:1px;background:var(--border);margin:16px 0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn-primary:hover{opacity:.85}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-outline:hover{background:var(--surface2)}
.btn-icon{background:transparent;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:6px;display:flex;align-items:center;transition:all .15s}
.btn-icon:hover{background:var(--surface2);color:var(--text)}
.btn-icon.danger:hover{color:var(--danger);background:var(--danger-bg)}
.config-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;max-width:500px}
.config-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.foto-upload{width:90px;height:90px;border-radius:var(--r-lg);border:2px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex-shrink:0;background:var(--surface2)}
.foto-upload:hover{border-color:var(--accent)}
.foto-upload img{width:100%;height:100%;object-fit:cover}
.foto-txt{font-size:10px;color:var(--text3);text-align:center;padding:4px}
.prod-foto{width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0}
.prod-foto-ph{width:36px;height:36px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.link-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;text-decoration:none;border:1px solid var(--border);background:var(--surface);color:var(--text2);transition:all .15s}
.link-chip:hover{background:var(--accent-bg);color:var(--accent-text)}
.plat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.plat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px}
.plat-stat{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--border)}
.plat-stat:last-child{border-bottom:none}
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text3);gap:10px;font-size:13px}
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:12px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:slideIn .2s ease}
.toast.error{background:var(--danger)}
.toast.success{background:var(--success)}
.toast.info{background:#2563eb}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.shopee-badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:20px;font-size:9px;font-weight:600;background:#fef9c3;color:#713f12;margin-left:4px}
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px}
.filter-input{padding:5px 10px;font-size:12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font);outline:none;min-width:0}
.filter-input:focus{border-color:var(--accent);background:var(--surface)}
.filter-select{padding:5px 10px;font-size:12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font);outline:none}
.filter-clear{font-size:11px;color:var(--text3);cursor:pointer;background:none;border:none;font-family:var(--font);padding:4px 6px;border-radius:var(--r)}
.filter-clear:hover{color:var(--danger);background:var(--danger-bg)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Estratégia de preço (Calculadora) */
.calc-wrap.est{max-width:1240px;grid-template-columns:340px minmax(0,1fr)}
@media(max-width:980px){.calc-wrap.est{grid-template-columns:1fr}}
.calc-wrap.est .calc-row>span{display:flex;flex-direction:column}
.est-sub{font-size:10px;color:var(--text3);font-weight:400}
.est-wide{width:180px}
.est-muted{font-size:11px;color:var(--text3)}
.est-grp{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 2px}
.est-floors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.est-floor{border:1px solid var(--border);border-radius:var(--r-lg);padding:10px;background:var(--surface2)}
.est-floor.main{border-color:var(--accent);background:var(--accent-bg)}
.est-floor .k,.est-trio .k{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.est-floor .v{font-family:var(--mono);font-size:18px;font-weight:600;margin:2px 0}
.est-floor.main .v{color:var(--accent-text)}
.est-floor .d,.est-trio .d{font-size:10px;color:var(--text3)}
.est-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.est-trio>div{padding:10px 12px;border-right:1px solid var(--border)}
.est-trio>div:last-child{border-right:none}
.est-trio .v{font-family:var(--mono);font-size:20px;font-weight:600;margin:2px 0}
.est-trio .tab .v{color:var(--orange)}
.est-alert{border-radius:var(--r);padding:8px 10px;font-size:12px;margin-top:10px}
.est-alert.bad{background:var(--danger-bg);color:var(--danger)}
.est-alert.warn{background:var(--warn-bg);color:#92400e}
.est-save{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.est-sim-top{display:flex;align-items:center;gap:10px}
.est-sim-top input[type=range]{flex:1;accent-color:var(--orange)}

// Faixas de comissão/taxa fixa automáticas — editáveis em "⚙️ Taxas Automáticas" (sidebar).

function getTierPorPreco(tiers,preco,estrito){
  for(const t of tiers){
    if(t.ate==null) return t;
    if(estrito?preco<t.ate:preco<=t.ate) return t;
  }
  return tiers[tiers.length-1];
}
function tiersPlat(platId){
  const c=SISTEMA_CONFIG[platId];
  return(c&&Array.isArray(c.tiers)&&c.tiers.length)?c.tiers:null;
}
// Faixa que vale pro preço informado nessa plataforma (ou null se ela não tem faixas automáticas)
// Shopee: a comissão automática incide sobre (preço − cupom fixo em R$)

function baseDescontaCupom(n){return isComissaoAuto(n)||/^\s*(campanha|afiliados?|ads)\b/i.test(n||'');}
function cupomFixoShopee(platId,t,kitQty){
  if(platId!=='shopee'||!t||!t.fixas) return 0;
  let s=0;
  for(const r of t.fixas){
    if(!/cupom/i.test(r.n||'')) continue;
    if(kitQty&&r.kits&&r.kits.length>0&&!r.kits.includes(kitQty)) continue;
    s+=Number(r.v)||0;
  }
  return s;
}
function tierAutoPlat(platId,preco){
  const t=tiersPlat(platId);
  return t?getTierPorPreco(t,preco,!!SISTEMA_CONFIG[platId].estrito):null;
}

  const n=(nome||'').toLowerCase().trim();

function shopeeTaxaFixa(p){return getTierPorPreco(SISTEMA_CONFIG.shopee.tiers,p,false).taxaFixa;}

function registrarPlataformaExtra(ex){
  if(!ex||!ex.id||PLATS.some(p=>p.id===ex.id)) return;
  PLATS.push({id:ex.id,label:ex.label||ex.id,cls:'chip-custom',custom:true});
}
// Garante que o cliente tenha as taxas de toda plataforma existente (inclusive as criadas depois dele)
function garantirTaxasPlataformas(cli){
  if(!cli.taxas) cli.taxas={};
  for(const pl of PLATS){
    if(cli.taxas[pl.id]) continue;
    const baseP=(typeof TAXA_D!=='undefined'&&TAXA_D[pl.id])?TAXA_D[pl.id]:TAXA_D_EXTRA;
    const baseF=(typeof TF_D!=='undefined'&&TF_D[pl.id])?TF_D[pl.id]:TF_D_EXTRA;
    cli.taxas[pl.id]={perc:baseP.map(r=>({...r})),fixas:baseF.map(r=>({...r}))};
  }
}
function slugPlataforma(nome){
  return 'x_'+String(nome||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
async function carregarConfigTaxasAutomaticas(){
  try{
    const{data,error}=await sb.from('prec_sistema_config').select('*').eq('id',1).maybeSingle();
    if(!error&&data?.taxas_auto){
      const ta=data.taxas_auto;
      for(const k of Object.keys(ta)){
        if(k==='extras'){
          SISTEMA_CONFIG.extras=Array.isArray(ta.extras)?ta.extras:[];
          SISTEMA_CONFIG.extras.forEach(registrarPlataformaExtra);
        }else if(ta[k]&&Array.isArray(ta[k].tiers)&&ta[k].tiers.length){
          // mescla pra manter flags padrão (ex.: tiktok.estrito) quando o salvo não tiver
          SISTEMA_CONFIG[k]=Object.assign({},SISTEMA_CONFIG[k]||{},ta[k]);
        }
      }
    }
  }catch(err){console.error('Erro ao carregar config de taxas automáticas:',err);}
}
async function salvarConfigTaxasAutomaticas(){
  const payload={};
  for(const k of Object.keys(SISTEMA_CONFIG)){ payload[k]=SISTEMA_CONFIG[k]; }
  const{error}=await sb.from('prec_sistema_config').upsert({id:1,taxas_auto:payload});
  if(error){console.error('Erro ao salvar config de taxas automáticas:',error);toast('⚠️ ERRO ao salvar: '+error.message,'error');return;}
  toast('✅ Taxas automáticas salvas!');

  const el=document.getElementById('nova-plat-nome');

function rmTierAuto(pl,i){
  SISTEMA_CONFIG[pl].tiers.splice(i,1);

  const pay={client_id:clientId,sku:p.sku,nome:p.nome,fabricacao:p.fabricacao||false,plataformas:p.plataformas,kits:p.kits,foto_url:p.foto_url||null,links:p.links||{},custo_unidade:p.custo_unidade||null};

    if(produtoAntigo) await registrarHistorico(produtoAntigo,p,clientId);
  }
  else{

async function registrarHistorico(antigo,novo,clientId){
  const cli=ST.clients.find(c=>String(c.id)===String(clientId));
  if(!cli) return;
  const registros=[];
  const kitsAntigos=antigo.kits||[];
  const kitsNovos=novo.kits||[];
  for(const kNovo of kitsNovos){
    const kAntigo=kitsAntigos.find(k=>k.qty===kNovo.qty);
    if(!kAntigo) continue; // kit novo, sem histórico anterior
    const plats=new Set([...(antigo.plataformas||[]),...(novo.plataformas||[])]);
    for(const pl of plats){
      const precoAntigo=kAntigo.precos?.[pl];
      const precoNovo=kNovo.precos?.[pl];
      const custoAntigo=kAntigo.custos?.[pl];
      const custoNovo=kNovo.custos?.[pl];
      const mudouPreco=precoAntigo!==precoNovo&&(precoAntigo||precoNovo);
      const mudouCusto=custoAntigo!==custoNovo&&(custoAntigo||custoNovo);
      if(!mudouPreco&&!mudouCusto) continue;
      const rAntigo=calcR(precoAntigo,custoAntigo,pl,cli.taxas,kAntigo.peso_kg||0,kAntigo.qty);
      const rNovo=calcR(precoNovo,custoNovo,pl,cli.taxas,kNovo.peso_kg||0,kNovo.qty);
      registros.push({
        client_id:clientId,product_id:novo.id,sku:novo.sku,nome_produto:novo.nome,
        plataforma:pl,kit_qty:kNovo.qty,
        campo:mudouPreco&&mudouCusto?'preco_custo':mudouPreco?'preco':'custo',
        valor_antigo:mudouPreco?precoAntigo:custoAntigo,
        valor_novo:mudouPreco?precoNovo:custoNovo,
        lucro_antigo:rAntigo?rAntigo.lucro:null,
        lucro_novo:rNovo?rNovo.lucro:null,
        margem_antiga:rAntigo?rAntigo.margem:null,
        margem_nova:rNovo?rNovo.margem:null,
      });
    }
  }
  if(registros.length){
    const{error}=await sb.from('prec_historico').insert(registros);
    if(error)console.error('Erro ao salvar histórico:',error);
  }
}

function isTaxaFixaShopee(nome){
  const n=(nome||'').toLowerCase().trim();
  return n==='taxa fixa'||n==='taxa fixa shopee'||n==='taxa fixa (auto)';
}

function getMargemPorCurva(cliente,curva,tipoProduto,platId){
  const cv=curva||'N';
  const tipo=tipoProduto==='revendedor'?'revendedor':'fabricacao'; // padrão: fabricação
  const validada=(cliente.status_por_plataforma?.[platId]??true)!==false; // status daquela plataforma específica
  const statusKey=validada?'validada':'nova';
  // Se o usuário já editou a margem em Config (por tipo de SKU + status da loja), usa o valor dele
  const porTipo=cliente.margem_por_curva?.[tipo];
  const porStatus=porTipo&&typeof porTipo[statusKey]==='object'?porTipo[statusKey]:null;
  if(porStatus&&porStatus[cv]!=null) return porStatus[cv];
  // Senão, cai na tabela padrão
  const padrao={
    fabricacao:{validada:{A:18,B:15,C:13,N:8},nova:{A:14,B:12,C:8,N:5}},
    revendedor:{validada:{A:12,B:9,C:7,N:5},nova:{A:9,B:7,C:5,N:4}}
  };
  const grupo=padrao[tipo][statusKey];
  return grupo?.[cv]??grupo?.['N']??8;
}

function arredondarPara99(preco){
  // Arredonda para o ,99 mais próximo — considerando tanto o ,99 abaixo quanto o de cima
  const baixo=Math.floor(preco-0.99)+0.99; // maior valor terminado em ,99 que seja <= preço
  const alto=baixo+1; // o próximo ,99 acima
  return Math.abs(preco-baixo)<=Math.abs(preco-alto)?baixo:alto;
}

function calcPrecoIdeal(custo,platId,taxas,pesoKg,kitQty,cliente,curva,tipoProduto){
  if(!custo||custo<=0) return null;
  const t=taxas[platId];if(!t) return null;
  // Margem alvo: sempre pela regra por curva ABC (curva real, ou 'PN'/sem curva quando o produto
  // ainda não apareceu em nenhum extrato importado), considerando o tipo do PRÓPRIO SKU
  const metaPerc=getMargemPorCurva(cliente,curva,tipoProduto,platId)/100;
  let p=custo*2;
  let tpFinal=0,tfFinal=0;
  for(let i=0;i<100;i++){
    // Soma TODAS as taxas percentuais, usando a comissão automática da Shopee quando aplicável
    let tp=0,comPct=0;
    for(const r of t.perc){
      let v=r.v;
      if(isComissaoAuto(r.n)&&r.auto!==false){const tr=tierAutoPlat(platId,p);if(tr) v=tr.comissao;}
      if(baseDescontaCupom(r.n)) comPct+=v/100;
      tp+=v/100;
    }
    let tf=0;
    for(const r of t.fixas){
      let v=r.v;
      if(isTaxaFixaAuto(r.n)&&r.auto!==false){const tr=tierAutoPlat(platId,p);if(tr) v=tr.taxaFixa;}
      const nL=r.n.toLowerCase();
      const isKitSpecific=nL.includes('embal')||nL.includes('frete');
      if(isKitSpecific&&kitQty){
        const mencionaK3=/\bk3\b/.test(nL)||/k3\/5/.test(nL)||/\b3\/5\b/.test(nL);
        const mencionaK5=/\bk5\b/.test(nL)||/k3\/5/.test(nL)||/\b3\/5\b/.test(nL);
        const mencionaK10=/\bk10\b/.test(nL);
        if(mencionaK3||mencionaK5||mencionaK10){
          const kitAlvo=kitQty<=3?'k3':kitQty<=5?'k5':'k10';
          const bate=(kitAlvo==='k3'&&mencionaK3)||(kitAlvo==='k5'&&mencionaK5)||(kitAlvo==='k10'&&mencionaK10);
          if(!bate)continue;
        }
      }
      tf+=v;
    }
    const frML=(platId==='ml_classico'||platId==='ml_premium')&&pesoKg>0?calcFreteML(pesoKg,p):0;
    tf+=frML;
    tf-=comPct*cupomFixoShopee(platId,t,kitQty); // desconto do cupom na base da comissão (Shopee)
    tpFinal=tp;tfFinal=tf;
    // margem % = metaPerc → (p - custo - tf - p*tp)/p = metaPerc
    const p2=(custo+tf)/(1-tp-metaPerc);
    if(!isFinite(p2)||p2<=0) break;
    if(Math.abs(p2-p)<0.005) {p=p2;break;}
    // Amortecimento: evita oscilação infinita entre faixas quando comissão/taxa fixa
    // não mudam de faixa juntas (ex: uma travada em "Manual" e outra em "Auto")
    p=i<20?p2:(p*0.5+p2*0.5);
  }
  let precoArredondado=arredondarPara99(Math.max(0,p));
  // Recalcular a margem real com o preço arredondado
  let r=calcR(precoArredondado,custo,platId,taxas,pesoKg,kitQty);
  // Nunca ficar abaixo da meta: sobe de ,99 em ,99 até atingir a margem configurada
  for(let k=0;k<30&&r&&r.margem<metaPerc*100-0.0001;k++){
    precoArredondado=Math.round((precoArredondado+1)*100)/100;
    r=calcR(precoArredondado,custo,platId,taxas,pesoKg,kitQty);
  }
  return{preco:precoArredondado,margemPerc:r?r.margem:metaPerc*100,curvaUsada:curva||null,metaUsada:metaPerc*100,tpUsado:tpFinal*100,tfUsado:tfFinal,precoConvergido:p};
}
function calcR(preco,custo,platId,taxas,pesoKg,kitQty){
  if(!preco||preco<=0||!custo||custo<=0)return null;
  const t=taxas[platId];if(!t)return null;
  let totalPerc=0;const percDetail=[];
  for(const r of t.perc){
    // Filtro por kit: se a taxa tem kits definidos e o kitQty não está na lista, pula
    if(kitQty&&r.kits&&r.kits.length>0&&!r.kits.includes(kitQty))continue;
    let v=r.v;if(isComissaoAuto(r.n)&&r.auto!==false){const tr=tierAutoPlat(platId,preco);if(tr)v=tr.comissao;}
    const baseCom=baseDescontaCupom(r.n)?Math.max(0,preco-cupomFixoShopee(platId,t,kitQty)):preco;
    totalPerc+=v/100;percDetail.push({n:r.n,v,val:baseCom*v/100,auto:r.auto});
  }
  let totalFixa=0;const fixaDetail=[];
  for(const r of t.fixas){
    // Filtro por kit configurado manualmente na aba Taxas
    if(kitQty&&r.kits&&r.kits.length>0&&!r.kits.includes(kitQty))continue;
    let v=r.v;
    if(isTaxaFixaAuto(r.n)&&r.auto!==false){const tr=tierAutoPlat(platId,preco);if(tr) v=tr.taxaFixa;}
    // Embalagem ou Frete por kit: usar só a taxa correspondente ao kit atual (detecção por nome)
    const nL=r.n.toLowerCase();
    const isKitSpecific=nL.includes('embal')||nL.includes('frete');
    if(isKitSpecific&&kitQty){
      const mencionaK3=/\bk3\b/.test(nL)||/k3\/5/.test(nL)||/\b3\/5\b/.test(nL);
      const mencionaK5=/\bk5\b/.test(nL)||/k3\/5/.test(nL)||/\b3\/5\b/.test(nL);
      const mencionaK10=/\bk10\b/.test(nL);
      if(mencionaK3||mencionaK5||mencionaK10){
        const kitAlvo=kitQty<=3?'k3':kitQty<=5?'k5':'k10';
        const bateK3=kitAlvo==='k3'&&mencionaK3;
        const bateK5=kitAlvo==='k5'&&mencionaK5;
        const bateK10=kitAlvo==='k10'&&mencionaK10;
        if(!bateK3&&!bateK5&&!bateK10)continue;
      }
    }
    totalFixa+=v;fixaDetail.push({n:r.n,v,val:v,auto:r.auto});
  }
  let freteML=0;
  if((platId==='ml_classico'||platId==='ml_premium')&&pesoKg>0){freteML=calcFreteML(pesoKg,preco);totalFixa+=freteML;fixaDetail.push({n:'Frete ML (auto)',v:freteML,val:freteML});}
  // Arredondar cada taxa (como já é exibida) e somar os valores arredondados —
  // assim o Total de Taxas bate exatamente com a soma das linhas que aparecem na tela
  const round2=x=>Math.round((x+Number.EPSILON)*100)/100;
  percDetail.forEach(d=>{d.val=round2(d.val);});
  fixaDetail.forEach(d=>{d.val=round2(d.val);});
  const tax=percDetail.reduce((s,d)=>s+d.val,0)+fixaDetail.reduce((s,d)=>s+d.val,0);
  const lucro=preco-custo-tax;
  return{lucro,margem:preco>0?lucro/preco*100:0,tax,preco,custo,percDetail,fixaDetail,freteML};
}
function tipoDoProduto(p){return p?.fabricacao?'fabricacao':'revendedor';}
function getCurvaProduto(p,platId,kitQty){
  if(!p) return null;
  const skuNorm=(p.sku||'').trim().toUpperCase();
  const nomeNorm=(p.nome||'').trim().toUpperCase();
  const d=(CABC.dados||[]).find(d=>{
    // Cada plataforma tem sua própria curva — não deixa uma "herdar" a curva de outra
    if(platId&&d.plataforma&&d.plataforma!==platId) return false;
    if(skuNorm&&d.sku){
      const dSku=d.sku.trim().toUpperCase();
      if(dSku===skuNorm&&!kitQty) return true;
      // Formato "5KIT029" -> extrai qty e código; precisa bater os dois com o kit em questão
      // (senão um kit acaba herdando a curva de outro kit do mesmo produto)
      const mQtyCod=dSku.match(/^(\d+)KIT-?(\d+)/i);
      if(mQtyCod){
        const codBate=mQtyCod[2].replace(/^0+/,'')===skuNorm.replace(/^0+/,'');
        const qtyBate=!kitQty||Number(mQtyCod[1])===Number(kitQty);
        if(codBate&&qtyBate) return true;
        return false;
      }
      // Sem quantidade no SKU do extrato (formato antigo) — compara só o código
      const mCod=dSku.match(/KIT-?(\d+)/i);
      if(mCod&&mCod[1].replace(/^0+/,'')===skuNorm.replace(/^0+/,'')) return true;
    }
    if(!kitQty&&nomeNorm&&d.nome_produto&&d.nome_produto.trim().toUpperCase().includes(nomeNorm.substring(0,15))) return true;
    return false;
  });
  return d?.curva||null;
}
// Verde = margem bateu ou passou a meta da curva (configurada em Config, por tipo de SKU)
// Vermelho = ficou abaixo da meta. Prejuízo (lucro negativo) é sinalizado à parte em cada tela (não é uma 3ª cor)
function cor(r,qty,c,curva,tipoProduto,platId){
  if(!r)return null;
  const meta=getMargemPorCurva(c,curva,tipoProduto,platId);
  return r.margem>=meta?'g':'r';
}
function allRes(c){const out=[];for(const p of c.produtos){const tipoP=tipoDoProduto(p);for(const pl of(p.plataformas||[]))for(const k of(p.kits||[])){const r=calcR(k.precos?.[pl],k.custos?.[pl],pl,c.taxas,k.peso_kg||0,k.qty);if(r)out.push({p,pl,k,r,cor:cor(r,k.qty,c,getCurvaProduto(p,pl,k.qty),tipoP,pl)});}}return out;}
// allPlats: todas as plataformas onde pelo menos 1 produto está cadastrado (mesmo sem dados)
function allPlats(c){const s=new Set();for(const p of c.produtos)for(const pl of(p.plataformas||[]))s.add(pl);return[...s];}
function applyFilter(arr){
  const{sku,plat}=ST.filter;
  return arr.filter(x=>{
    const p=x.p||x;
    const pl=x.pl||null;
    if(sku&&!String(p.sku||'').toLowerCase().includes(sku.toLowerCase())&&!(p.nome||'').toLowerCase().includes(sku.toLowerCase()))return false;
    if(plat){
      // "ml" filtra tanto ml_classico quanto ml_premium
      if(plat==='ml'){
        if(pl&&pl!=='ml_classico'&&pl!=='ml_premium')return false;
        if(!pl&&!(p.plataformas||[]).some(x=>x==='ml_classico'||x==='ml_premium'))return false;
      }else{
        if(pl&&pl!==plat)return false;
        if(!pl&&!(p.plataformas||[]).includes(plat))return false;
      }
    }
    return true;
  });
}

  let top=rect.top-8;let left=rect.left+rect.width/2;
  tip.style.left=Math.max(8,Math.min(left-100,window.innerWidth-220))+'px';
  tip.style.top=Math.max(8,top-tip.offsetHeight-4)+'px';
}

function bestR(p,c){let best=null,bc=null;const pri={g:2,r:1};const tipoP=tipoDoProduto(p);for(const pl of(p.plataformas||[]))for(const k of(p.kits||[])){const r=calcR(k.precos?.[pl],k.custos?.[pl],pl,c.taxas,k.peso_kg||0,k.qty);if(r){const co=cor(r,k.qty,c,getCurvaProduto(p,pl,k.qty),tipoP,pl);if(!best||(pri[co]||0)>(pri[bc]||0)){best=r;bc=co;}}}return{r:best,cor:bc};}
function hlMark(str,q){if(!q||!str)return String(str||'');return String(str).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}

function renderTab(){
  const el=document.getElementById('content');if(!el)return;
  const c=gc();if(!c)return;
  const t=ST.tab;
  if(t==='busca')el.innerHTML=renderBusca(c);
  else if(t==='dashboard')el.innerHTML=renderDash(c);
  else if(t==='produtos')el.innerHTML=renderProdutos(c);
  else if(t==='custos')el.innerHTML=renderCustos(c);
  else if(t==='plataformas')el.innerHTML=renderPlataformas(c);
  else if(t==='alertas')el.innerHTML=renderAlertas(c);
  else if(t==='curva_abc')el.innerHTML=renderCurvaABC();
  else if(t==='taxas')el.innerHTML=renderTaxas(c);
  else if(t==='config')el.innerHTML=renderConfig(c);
  else if(t==='calculadora')el.innerHTML=renderCalculadora(c);
  else if(t==='estrategias')el.innerHTML=renderEstrategias(c);
}

    const ok=!q||(sc==='sku'&&String(p.sku||'').toLowerCase().includes(lq))||(sc==='produto'&&(p.nome||'').toLowerCase().includes(lq))||(sc!=='sku'&&sc!=='produto'&&(String(p.sku||'').toLowerCase().includes(lq)||(p.nome||'').toLowerCase().includes(lq)));
    if(ok){const{r,cor:co}=bestR(p,cli);const ar=allRes(cli).filter(x=>x.p.id===p.id);const avgM=ar.length?ar.reduce((s,x)=>s+x.r.margem,0)/ar.length:0;res.push({p,cli,r,cor:co,avgM});}

async function copiarIdealParaTeste(pid,cid,plat,kitQty,idealPreco){
  const cli=ST.clients.find(c=>String(c.id)===String(cid));
  const p=cli?.produtos?.find(x=>String(x.id)===String(pid));
  if(!p)return;
  const k=p.kits.find(x=>x.qty===kitQty);
  if(!k)return;
  const produtoAntigo=JSON.parse(JSON.stringify(p));
  if(!k.precos_teste)k.precos_teste={};
  k.precos_teste[plat]=Math.round(idealPreco*100)/100;
  try{
    const pay={client_id:cli.id,sku:p.sku,nome:p.nome,fabricacao:p.fabricacao||false,plataformas:p.plataformas,kits:p.kits,foto_url:p.foto_url||null,links:p.links||{},custo_unidade:p.custo_unidade||null};
    const{error}=await sb.from('prec_products').update(pay).eq('id',p.id);
    if(error)throw new Error(error.message);
    toast('✅ Preço Ideal copiado pro Preço Teste!');
  }catch(err){
    console.error('Erro ao copiar preço ideal:',err);
    toast('⚠️ ERRO ao salvar: '+(err.message||'falha desconhecida'),'error');
  }
  renderTab();

async function salvarPrecoRapido(pid,cid,plat,kitQty,val){
  const cli=ST.clients.find(c=>String(c.id)===String(cid));
  const p=cli?.produtos?.find(x=>String(x.id)===String(pid));
  if(!p)return;
  const k=p.kits.find(x=>x.qty===kitQty);
  if(!k)return;
  const novoValor=parseFloat(val)||0;
  if(!novoValor){toast('Digite um preço válido','error');return;}
  const produtoAntigo=JSON.parse(JSON.stringify(p));
  if(!k.precos)k.precos={};
  k.precos[plat]=novoValor;
  try{
    await saveProduct(p,cli.id,produtoAntigo);
    toast('✅ Preço salvo!');
    renderTab();
  }catch(err){
    console.error('Erro ao salvar preço:',err);
    toast('⚠️ ERRO ao salvar: '+(err.message||'falha desconhecida'),'error');

}

function idealDoKit(custo,pl,c,k,curva,tipoP){
  const est=k.estrategia?.[pl];
  if(est&&isFinite(est.alvo)) return {preco:Number(est.alvo),estrategia:true,reserva:est.reserva};
  return calcPrecoIdeal(custo,pl,c.taxas,k.peso_kg||0,k.qty,c,curva,tipoP);

  const el=cardEl.querySelector('[data-f="res-sobra"]');if(el) el.textContent='R$'+KC.resK.sobra.toFixed(2);

  const est=k.estrategia?.[plat];

function kitCalc(p,c,pl,k,preco){
  let r2=calcR(preco,k.custos?.[pl],pl,c.taxas,k.peso_kg||0,k.qty);
  // Estratégia salva: usos ativos da reserva entram como custo e a sobra da reserva aparece separada do lucro
  let resK=null;
  if(r2&&k.estrategia?.[pl]){
    const estK=k.estrategia[pl];
    const base=Math.max(0,r2.preco-cupomFixoShopee(pl,c.taxas[pl],k.qty));
    const usos=estUsosAtivos(c,p,k.qty,pl).map(u=>({n:(u.ferramenta||'Uso')+' (da reserva)',ferr:u.ferramenta,tipo:u.tipo,v:u.tipo==='%'?Number(u.valor):null,val:r2c(u.tipo==='%'?base*Number(u.valor)/100:Number(u.valor))}));
    // uso direcionado a uma ferramenta que já existe: soma na linha dela (ex.: Ads 3,5% + 3% da reserva)
    const pd=r2.percDetail.map(d=>({...d})),fd=r2.fixaDetail.map(d=>({...d}));
    usos.forEach(u=>{const d=pd.find(x=>x.n===u.ferr)||fd.find(x=>x.n===u.ferr);
      if(d){d.val=r2c(d.val+u.val);d.n=`${d.n} <span style="color:var(--accent-text)">+ ${u.tipo==='%'?String(u.v).replace('.',',')+'%':'R$'+u.val.toFixed(2)} da reserva</span>`;if(u.tipo==='%'&&d.v!=null)d.v=d.v+u.v;u.junto=true;}});
    r2={...r2,percDetail:pd,fixaDetail:fd};
    const usado=r2c(usos.reduce((s,u)=>s+u.val,0));
    const margR=r2c(r2.preco*(Number(estK.margem)||0)/100);
    const totR=Math.min(Math.max(0,r2c(r2.lucro-margR)),r2c(base*(Number(estK.reserva)||0)/100));
    const lucroDep=r2c(r2.lucro-usado);
    const sobra=Math.max(0,Math.min(r2c(totR-usado),r2c(lucroDep-margR)));
    resK={usos,usado,sobra,totR,pct:estK.reserva};
    r2={...r2,tax:r2c(r2.tax+usado+sobra),lucro:r2c(lucroDep-sobra)};r2.margem=r2.preco>0?r2.lucro/r2.preco*100:0;
  }
  return r2?{r2,resK}:null;
}

function inferCustoUnitario(p){
  if(p.custo_unidade) return{valor:p.custo_unidade,inferido:false};
  for(const k of(p.kits||[])){
    if(!k.qty)continue;
    for(const pl of(p.plataformas||[])){
      const custo=k.custos?.[pl];
      if(custo){return{valor:Math.round((custo/k.qty)*100)/100,inferido:true};}
    }
  }
  return{valor:null,inferido:false};
}

async function updCustoUnitarioLista(pid,val){
  const c=gc();if(!c)return;
  const p=c.produtos.find(x=>String(x.id)===String(pid));
  if(!p)return;
  const custoUnidade=parseFloat(val)||null;
  const statusEl=document.getElementById(`custo-status-${pid}`);
  if(!custoUnidade){
    if(statusEl){statusEl.textContent='⚠️ valor inválido';statusEl.style.color='var(--danger)';}
    return;
  }
  const produtoAntigo=JSON.parse(JSON.stringify(p));
  p.custo_unidade=custoUnidade;
  const plats=p.plataformas||[];
  let aplicados=0;
  (p.kits||[]).forEach(k=>{
    if(!k.qty)return;
    if(!k.custos)k.custos={};
    plats.forEach(pl=>{k.custos[pl]=Math.round(custoUnidade*k.qty*100)/100;aplicados++;});
  });
  if(!aplicados){
    if(statusEl){statusEl.textContent='⚠️ sem kits/plataformas';statusEl.style.color='var(--danger)';}
    return;
  }
  if(statusEl){statusEl.textContent='Salvando...';statusEl.style.color='var(--text3)';}
  try{
    await saveProduct(p,c.id,produtoAntigo);
    if(statusEl){statusEl.textContent=`✅ aplicado em ${aplicados} campo(s)`;statusEl.style.color='var(--success)';}
  }catch(err){
    console.error('Erro ao salvar custo:',err);
    if(statusEl){statusEl.textContent='⚠️ erro ao salvar';statusEl.style.color='var(--danger)';}
    toast('⚠️ ERRO ao salvar: '+(err.message||'falha desconhecida'),'error');
  }
}

async function salvarCustosSelecionados(){
  const marcados=[...document.querySelectorAll('.custo-check:checked')].map(cb=>cb.dataset.pid);

                  }).join('')}

                </div>
              </div>`;
            }).join('');
          })()}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function getMargemRaw(cliente,tipo,status,curva){
  const porTipo=cliente.margem_por_curva?.[tipo];
  const porStatus=porTipo?.[status];
  if(porStatus&&typeof porStatus==='object'&&porStatus[curva]!=null) return porStatus[curva];
  const padrao={
    fabricacao:{validada:{A:18,B:15,C:13,N:8},nova:{A:14,B:12,C:8,N:5}},
    revendedor:{validada:{A:12,B:9,C:7,N:5},nova:{A:9,B:7,C:5,N:4}}
  };
  return padrao[tipo][status][curva];
}

/* ======================================================================
   ESTRATÉGIA DE PREÇO — Calculadora (piso, alvo, tabela e reserva de marketing)
   Usa as taxas da loja (aba Taxas) e o mesmo cálculo do card do produto (calcR).
   ====================================================================== */
const CAT_LABEL={plat:'Plataforma',imp:'Impostos e custos',mkt:'Ferramentas de marketing'};
function catTaxaInferida(n){
  n=(n||'').toLowerCase();
  if(/comiss|taxa fixa|taxa frete|frete|estoque full|tarifa/.test(n)) return 'plat';
  if(/\bads\b|ads |afiliad|campanha|cupom|rel[aâ]mpago|leve|live|v[ií]deo|influ|promo/.test(n)) return 'mkt';
  return 'imp';
}
function catTaxa(r){return (r&&r.cat)||catTaxaInferida(r?.n);}
function updTaxaCat(pl,tipo,i,v){gc().taxas[pl][tipo][i].cat=v;renderTab();}
const escH=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const r2c=x=>Math.round((x+Number.EPSILON)*100)/100;
const brlE=v=>isFinite(v)?'R$ '+v.toFixed(2).replace('.',','):'–';
const pctE=(v,d=2)=>isFinite(v)?(v*100).toFixed(d).replace('.',',')+'%':'–';

// Taxas da loja para a plataforma; semMkt = tira as ferramentas de marketing (piso cru)
function estTaxas(c,pl,semMkt){
  const t=c.taxas?.[pl];if(!t) return null;
  const f=r=>!(semMkt&&catTaxa(r)==='mkt');
  return {...c.taxas,[pl]:{...t,perc:t.perc.filter(f),fixas:t.fixas.filter(f)}};
}
function estCupom(c,pl,semMkt,kit){const tx=estTaxas(c,pl,semMkt);return tx?cupomFixoShopee(pl,tx[pl],kit):0;}
function estConta(c,pl,P,custo,peso,kit,semMkt){const tx=estTaxas(c,pl,semMkt);return tx?calcR(P,custo,pl,tx,peso,kit):null;}
// Menor preço (no centavo) que paga custo + taxas e deixa a margem mínima + a reserva
function estPrecoMin(c,pl,custo,peso,kit,semMkt,meta,reserva){
  if(!custo||custo<=0) return NaN;
  const cup=estCupom(c,pl,semMkt,kit);
  const ok=P=>{const r=estConta(c,pl,P,custo,peso,kit,semMkt);return !!r&&r.lucro>=meta*P+reserva*Math.max(0,P-cup)-1e-9;};
  let lo=0.01,hi=Math.max(1,custo);
  while(!ok(hi)&&hi<1e6) hi*=2;
  if(hi>=1e6) return NaN;
  for(let i=0;i<60&&hi-lo>0.004;i++){const m=(lo+hi)/2;ok(m)?hi=m:lo=m;}
  let P=Math.ceil(hi*100-1e-6)/100;
  for(let i=0;i<300&&P>0.01&&ok(r2c(P-0.01));i++) P=r2c(P-0.01);
  for(let i=0;i<300&&!ok(P);i++) P=r2c(P+0.01);
  return P;
}

/* ---------- produto / kit selecionados ---------- */
function estProd(c){return (c.produtos||[]).find(p=>String(p.id)===String(ST.calc.prodId))||null;}
function estKit(p){return p?.kits?.find(k=>Number(k.qty)===Number(ST.calc.kit))||null;}
function estPlatsDoProduto(p){
  if(!p) return PLATS;
  const ids=ordenarPlatsIds(p.plataformas||[]);
  const l=ids.map(id=>PLATS.find(x=>x.id===id)).filter(Boolean);
  return l.length?l:PLATS;
}
function estDefaults(){
  const ca=ST.calc;
  if(ca.reserva==null) ca.reserva='5';
  if(ca.desconto==null) ca.desconto='30';
  if(ca.margem==null) ca.margem='';
  if(ca.extra==null) ca.extra='';
  if(ca.tabelaManual==null) ca.tabelaManual='';
  if(ca.sim==null) ca.sim=ca.desconto;
}
// Ao escolher SKU/kit/plataforma: puxa custo e peso do cadastro e a estratégia salva (se houver)
function estCarregarKit(){
  const c=gc();const ca=ST.calc;const p=estProd(c);const k=estKit(p);
  if(!k) return;
  const pl=ca.plat;
  ca.custo=k.custos?.[pl]!=null?String(k.custos[pl]):'';
  ca.peso=k.peso_kg?String(k.peso_kg):'';
  const est=k.estrategia?.[pl];
  if(est){
    ca.reserva=String(est.reserva??5);ca.desconto=String(est.desconto??30);
    ca.margem=est.margem_manual?String(est.margem):'';
    ca.tabelaManual=est.tabela_manual?String(est.tabela):'';
  }else{ca.tabelaManual='';ca.margem='';}
  ca.sim=ca.desconto;ca.extra='';
}
function onCalcProd(id){
  const c=gc();ST.calc.prodId=id||null;ST.calc.kit=null;
  const p=estProd(c);
  if(p){
    const plats=estPlatsDoProduto(p);
    if(!plats.find(x=>x.id===ST.calc.plat)) ST.calc.plat=plats[0].id;
    const kits=ordenarKits(p.kits||[]);
    if(kits.length) ST.calc.kit=kits[0].qty;
    estCarregarKit();
  }
  renderTab();
}
function onCalcKit(qty){ST.calc.kit=parseInt(qty)||null;estCarregarKit();renderTab();}
function onCalcPlat(pl){ST.calc.plat=pl;estCarregarKit();renderTab();}
function estInput(campo,valor){
  ST.calc[campo]=valor;
  if(campo==='desconto'){ST.calc.sim=valor;const s=document.getElementById('est-sim-range');const n=document.getElementById('est-sim-num');if(s)s.value=valor;if(n)n.value=valor;}
  updateCalc();
}
function estSim(v,origem){
  ST.calc.sim=v;
  if(origem!=='range'){const s=document.getElementById('est-sim-range');if(s)s.value=v;}
  if(origem!=='num'){const n=document.getElementById('est-sim-num');if(n)n.value=v;}

}
function estIrPara(qual){
  const E=estCalcular();if(!E) return;
  const v=qual==='dia'?parseFloat(ST.calc.desconto)||0:qual==='ferr'?Math.floor(E.dmax*1000)/10:Math.floor(E.dcru*1000)/10;
  estSim(String(v));
}
function estAbrir(prodId,qty,pl){ST.calc.prodId=prodId;ST.calc.kit=qty;ST.calc.plat=pl;estCarregarKit();renderTab();document.getElementById('content')?.scrollTo({top:0,behavior:'smooth'});}

/* ---------- reserva de marketing: lançamentos (tabela prec_reserva_uso) ---------- */
async function estCarregarUsos(force){
  const c=gc();if(!c) return;
  if(!force&&ST.reserva?.clientId===c.id) return;
  ST.reserva={clientId:c.id,rows:[],erro:null,carregando:true};
  const{data,error}=await sb.from('prec_reserva_uso').select('*').eq('client_id',c.id).order('created_at',{ascending:false});
  ST.reserva={clientId:c.id,rows:error?[]:(data||[]),erro:error?(error.message||'erro'):null,carregando:false};
}
function estUsosAtivos(c,p,kit,pl){
  if(!p||!ST.reserva||ST.reserva.clientId!==c.id) return [];
  return ST.reserva.rows.filter(u=>!u.encerrado_em&&String(u.product_id)===String(p.id)&&Number(u.kit_qty)===Number(kit)&&u.plataforma===pl);
}
async function estAddUso(){
  const c=gc();const p=estProd(c);const k=estKit(p);const pl=ST.calc.plat;
  if(!p||!k){toast('Escolha o SKU e o kit primeiro','error');return;}
  let ferr=document.getElementById('est-uso-ferr')?.value?.trim();
  if(ferr==='__outra') ferr=document.getElementById('est-uso-outra')?.value?.trim();
  const tipo=document.getElementById('est-uso-tipo')?.value||'%';
  const valor=parseFloat(String(document.getElementById('est-uso-valor')?.value||'').replace(',','.'));
  const motivo=document.getElementById('est-uso-motivo')?.value?.trim()||null;
  if(!ferr){toast('Informe a ferramenta (ex.: Ads extra, Live, Desconto extra)','error');return;}

  const row={client_id:c.id,product_id:p.id,kit_qty:k.qty,plataforma:pl,ferramenta:ferr,tipo,valor,motivo};
  const{data,error}=await sb.from('prec_reserva_uso').insert(row).select().single();
  if(error){toast('⚠️ Não foi possível salvar o uso: '+error.message,'error');return;}
  ST.reserva.rows.unshift(data);
  toast('✅ Uso da reserva registrado');renderTab();
}
async function estEncerrarUso(id){
  const agora=new Date().toISOString();
  const{error}=await sb.from('prec_reserva_uso').update({encerrado_em:agora}).eq('id',id);
  if(error){toast('⚠️ Não foi possível encerrar: '+error.message,'error');return;}
  const u=ST.reserva.rows.find(x=>String(x.id)===String(id));if(u) u.encerrado_em=agora;
  toast('Uso encerrado — o valor volta para a reserva');renderTab();
}

/* ---------- cálculo ---------- */
function estCalcular(){
  const c=gc();if(!c) return null;
  estDefaults();
  const ca=ST.calc;const pl=ca.plat||'shopee';
  const p=estProd(c),k=estKit(p);
  const custo=parseFloat(ca.custo)||0,peso=parseFloat(ca.peso)||0,kit=k?.qty||null;
  const curva=p?getCurvaProduto(p,pl,kit):null;
  const margemCurva=getMargemPorCurva(c,curva,p?tipoDoProduto(p):'fabricacao',pl);
  const margemManual=ca.margem!==''&&ca.margem!=null&&isFinite(parseFloat(ca.margem));
  const margem=(margemManual?parseFloat(ca.margem):margemCurva)/100;
  const reserva=(parseFloat(ca.reserva)||0)/100,desc=Math.min(0.95,(parseFloat(ca.desconto)||0)/100);
  const piso=estPrecoMin(c,pl,custo,peso,kit,true,margem,0);
  const comFerr=estPrecoMin(c,pl,custo,peso,kit,false,margem,0);
  const alvoCalc=estPrecoMin(c,pl,custo,peso,kit,false,margem,reserva);
  let tabSug=NaN;
  if(isFinite(alvoCalc)){tabSug=Math.ceil(alvoCalc/(1-desc)*100-1e-6)/100;for(let i=0;i<50&&r2c(tabSug*(1-desc))<alvoCalc-0.001;i++)tabSug=r2c(tabSug+0.01);}
  const tabMan=parseFloat(ca.tabelaManual)||0;const tab=tabMan>0?tabMan:tabSug;
  const alvo=r2c(tab*(1-desc));
  return{c,p,k,pl,custo,peso,kit,curva,margemCurva,margemManual,margem,reserva,desc,piso,comFerr,alvoCalc,tabSug,tabMan,tab,alvo,
    dmax:1-comFerr/tab,dcru:1-piso/tab,usos:estUsosAtivos(c,p,kit,pl)};
}
function estSimular(E){
  const d=Math.min(0.95,(parseFloat(ST.calc.sim)||0)/100);
  const P=r2c(E.tab*(1-d));
  const r=estConta(E.c,E.pl,P,E.custo,E.peso,E.kit,false);
  if(!r) return null;
  const cup=estCupom(E.c,E.pl,false,E.kit),base=Math.max(0,P-cup);
  const simExtra=parseFloat(String(ST.calc.extra||'').replace(',','.'))||0;
  const extras=[...E.usos.map(u=>({n:u.ferramenta||'Uso da reserva',tipo:u.tipo||'%',v:Number(u.valor)||0,motivo:u.motivo})),
    ...(simExtra?[{n:'Simulação: ferramenta agressiva',tipo:'%',v:simExtra}]:[])]
    .map(x=>({...x,val:x.tipo==='%'?r2c(base*x.v/100):r2c(x.v)}));
  const usado=r2c(extras.reduce((s,x)=>s+x.val,0));
  const margR=r2c(P*E.margem);
  const totR=Math.min(Math.max(0,r2c(r.lucro-margR)),r2c(base*E.reserva));
  const lucroDep=r2c(r.lucro-usado);
  const sobra=Math.max(0,Math.min(r2c(totR-usado),r2c(lucroDep-margR)));
  const lucro=r2c(lucroDep-sobra);
  const tx=estTaxas(E.c,E.pl,false)[E.pl];
  const catOf=n=>{const row=[...tx.perc,...tx.fixas].find(x=>x.n===n);return row?catTaxa(row):'plat';};
  const L=[...r.percDetail.map(x=>({n:x.n,cat:catOf(x.n),rate:x.v/100,val:x.val,base:baseDescontaCupom(x.n)?base:P})),
           ...r.fixaDetail.map(x=>({n:x.n,cat:catOf(x.n),rate:null,val:x.val}))];
  extras.forEach(x=>{
    const alvo=L.find(l=>!l.res&&l.n===x.n);
    if(alvo){alvo.val=r2c(alvo.val+x.val);alvo.extra=(alvo.extra||[]).concat(x.tipo==='%'?String(x.v).replace('.',',')+'%':brlE(x.val));if(x.tipo==='%'&&alvo.rate!=null)alvo.rate+=x.v/100;alvo.temReserva=true;}
    else L.push({n:x.n+' (da reserva)',cat:'mkt',rate:x.tipo==='%'?x.v/100:null,val:x.val,base,res:true});
  });
  if(sobra>0) L.push({n:'Reserva de marketing (sobra)',cat:'mkt',rate:null,val:sobra,sobra:true});
  const taxas=r2c(L.reduce((s,x)=>s+x.val,0)),total=r2c(taxas+E.custo);
  return{d,P,base,cup,L,taxas,total,lucro,lp:P?lucro/P:NaN,margR,totR,usado,sobra,passou:lucroDep<margR-0.01};
}

function estResumoProduto(p){
  const itens=[];
  for(const k of ordenarKits(p.kits||[])) for(const pl of ordenarPlatsIds(Object.keys(k.estrategia||{}))){
    const est=k.estrategia[pl];if(!est) continue;
    const st=estSituacao(Number(k.precos?.[pl])||null,est);
    itens.push(`<span class="est-pchip" style="border-color:${st.cor};background:${st.bg}" title="Piso ${brlE(est.piso)} · Alvo ${brlE(est.alvo)} · Tabela ${brlE(est.tabela)}">🎯 K${k.qty} ${PLATS.find(x=>x.id===pl)?.label||pl}: <b>Piso ${est.piso.toFixed(2)}</b> · <b>Alvo ${est.alvo.toFixed(2)}</b> · <b>Tab ${est.tabela.toFixed(2)}</b> <span style="color:${st.cor};font-weight:700">${st.txt}</span></span>`);
  }
  return itens.length?`<div class="est-presumo">${itens.join('')}</div>`:`<div class="est-presumo"><span class="est-pchip" style="border-style:dashed;color:var(--text3)">🎯 Sem estratégia salva</span></div>`;
}
function estSituacao(atual,est){
  if(!atual) return {txt:'Sem preço atual',cor:'var(--text3)',bg:'var(--surface2)',k:'sem'};
  if(atual<est.piso-0.005) return {txt:'Abaixo do piso',cor:'var(--danger)',bg:'var(--danger-bg)',k:'piso'};
  if(atual<est.com_ferramentas-0.005) return {txt:'Comendo a margem',cor:'var(--danger)',bg:'var(--danger-bg)',k:'margem'};
  if(atual<est.alvo-0.005) return {txt:'Usando a reserva',cor:'var(--warn)',bg:'var(--warn-bg)',k:'reserva'};
  return {txt:'No alvo',cor:'var(--success)',bg:'var(--success-bg)',k:'alvo'};
}
function estLinhas(c){
  const rows=[];
  for(const p of (c.produtos||[])) for(const k of ordenarKits(p.kits||[])) for(const [pl,est] of Object.entries(k.estrategia||{})){
    if(!est) continue;
    const atual=Number(k.precos?.[pl])||null;
    const usos=estUsosAtivos(c,p,k.qty,pl);
    rows.push({p,k,pl,est,atual,usos,st:estSituacao(atual,est)});
  }
  return rows.sort((a,b)=>String(a.p.sku||a.p.nome).localeCompare(String(b.p.sku||b.p.nome),'pt-BR',{numeric:true})||a.k.qty-b.k.qty);
}
function estFiltro(campo,v){if(!ST.estF)ST.estF={plat:'',q:'',sit:''};ST.estF[campo]=v;renderTab();if(campo==='q'){const el=document.getElementById('est-busca');if(el){el.focus();el.setSelectionRange(v.length,v.length);}}}
function renderEstrategias(c){

      <div class="est-card-usos">${x.usos.length?`<div class="l">Usos ativos da reserva</div>`+x.usos.map(u=>`<div class="est-uso"><span>${escH(u.ferramenta)} · <b>${u.tipo==='%'?String(u.valor).replace('.',',')+'%':brlE(Number(u.valor))}</b>${u.motivo?` <span style="color:var(--text3)">— ${escH(u.motivo)}</span>`:''}</span><button class="btn btn-outline est-mini" onclick="estEncerrarUso('${u.id}')">Encerrar</button></div>`).join(''):'<span style="color:var(--text3)">Reserva sem uso ativo</span>'}</div>
      <div class="est-card-f"><span>Salvo em ${new Date(x.est.salvo_em).toLocaleDateString('pt-BR')}</span><button class="btn btn-outline est-mini" onclick="setTab('calculadora').then(()=>estAbrir('${x.p.id}',${x.k.qty},'${x.pl}'))">Abrir na Calculadora</button></div>

  return`<div style="max-width:1240px">
    <div class="est-kpis">

      <span class="est-chip ${!F.plat?'on':''}" onclick="estFiltro('plat','')">Todas</span>

      ${F.sit?`<span class="est-chip on" onclick="estFiltro('sit','')">✕ limpar situação</span>`:''}

    ${!todas.length?`<div class="calc-card" style="text-align:center;color:var(--text3);padding:30px">Nenhuma estratégia salva nesta loja ainda.<br>Abra a <a href="#" onclick="setTab('calculadora');return false">Calculadora</a>, escolha um SKU e clique em "Salvar estratégia neste SKU".</div>`

function renderEstLoja(c){
  const rows=[];
  for(const p of (c.produtos||[])){
    for(const k of ordenarKits(p.kits||[])){
      for(const [pl,est] of Object.entries(k.estrategia||{})){
        if(!est) continue;
        const atual=Number(k.precos?.[pl])||null;
        const usos=estUsosAtivos(c,p,k.qty,pl);
        const usoPct=usos.filter(u=>u.tipo==='%').reduce((s,u)=>s+(Number(u.valor)||0),0);
        const usoRS=usos.filter(u=>u.tipo!=='%').reduce((s,u)=>s+(Number(u.valor)||0),0);
        let st=['—','var(--text3)'];
        if(atual){
          if(atual<est.piso-0.005) st=['Abaixo do piso','var(--danger)'];
          else if(atual<est.com_ferramentas-0.005) st=['Comendo a margem','var(--danger)'];
          else if(atual<est.alvo-0.005) st=['Usando a reserva','var(--warn)'];
          else st=['No alvo','var(--success)'];
        }
        rows.push({p,k,pl,est,atual,usoPct,usoRS,st});
      }
    }
  }
  if(!rows.length) return`<div class="est-muted">Nenhuma estratégia salva ainda. Escolha um SKU acima e clique em "Salvar estratégia neste SKU".</div>`;
  return`<div class="table-scroll"><table class="est-table">
    <thead><tr><th>SKU</th><th>Kit</th><th>Plataforma</th><th class="num">Piso</th><th class="num">Alvo</th><th class="num">Tabela</th><th class="num">Preço atual</th><th class="num">Reserva</th><th class="num">Usado</th><th>Situação</th><th></th></tr></thead>
    <tbody>${rows.map(x=>`<tr>
      <td>${escH(x.p.sku||x.p.nome)}</td><td>${x.k.qty}</td><td>${PLATS.find(y=>y.id===x.pl)?.label||x.pl}</td>
      <td class="num">${brlE(x.est.piso)}</td><td class="num">${brlE(x.est.alvo)}</td><td class="num">${brlE(x.est.tabela)}</td>
      <td class="num">${x.atual?brlE(x.atual):'–'}</td><td class="num">${String(x.est.reserva??'').replace('.',',')}%</td>
      <td class="num">${x.usoPct?String(r2c(x.usoPct)).replace('.',',')+'%':''}${x.usoPct&&x.usoRS?' + ':''}${x.usoRS?brlE(x.usoRS):''}${!x.usoPct&&!x.usoRS?'–':''}</td>
      <td><span style="color:${x.st[1]};font-weight:600">${x.st[0]}</span></td>
      <td><button class="btn btn-outline est-mini" onclick="estAbrir('${x.p.id}',${x.k.qty},'${x.pl}')">Abrir</button></td>
    </tr>`).join('')}</tbody></table></div>`;
}

function updateCalc(){
  const top=document.getElementById('est-top');if(!top) return;
  const E=estCalcular();if(!E) return;
  const curvaLbl={A:'Curva A',B:'Curva B',C:'Curva C',N:'PN'}[E.curva||'N'];
  const ms=document.getElementById('est-marg-sub');
  if(ms) ms.textContent=E.margemManual?'valor digitado':`padrão ${curvaLbl}: ${String(E.margemCurva).replace('.',',')}% — deixe vazio para usar`;
  const mi=document.getElementById('est-marg');if(mi&&!E.margemManual) mi.placeholder=String(E.margemCurva);
  if(!E.custo){
    top.innerHTML='<div class="est-muted" style="padding:20px;text-align:center">Escolha um SKU ou digite o custo de compra para calcular.</div>';
    ['est-det','est-res','est-taxas'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='';});
    return;
  }
  const S=estSimular(E);
  const rs=document.getElementById('est-res-sub');if(rs&&S) rs.textContent=`= ${brlE(r2c(S.base*E.reserva))} no preço simulado`;
  // Pisos e preços para cadastrar
  top.innerHTML=`<div class="est-floors">
      <div class="est-floor"><div class="k">Piso cru</div><div class="v">${brlE(E.piso)}</div><div class="d">custo + taxas + margem, sem ferramentas de marketing · só estratégia</div></div>
      <div class="est-floor"><div class="k">Com ferramentas</div><div class="v">${brlE(E.comFerr)}</div><div class="d">piso + ferramentas de marketing, sem reserva</div></div>
      <div class="est-floor main"><div class="k">Alvo</div><div class="v">${brlE(E.alvoCalc)}</div><div class="d">+ reserva de marketing · preço do dia a dia</div></div>
    </div>
    <div class="est-trio">
      <div><div class="k">Piso (cru)</div><div class="v">${brlE(E.piso)}</div><div class="d">só sem ferramentas</div></div>
      <div><div class="k">Alvo (dia a dia)</div><div class="v">${brlE(E.alvo)}</div><div class="d">tabela − ${pctE(E.desc,1)}</div></div>
      <div class="tab"><div class="k">Tabela (riscado)</div><div class="v">${brlE(E.tab)}</div><div class="d">com ferramentas até ${pctE(E.dmax,1)} · piso cru ${pctE(E.dcru,1)}${E.tabMan?' · valor digitado':''}</div></div>
    </div>
    ${E.alvo<E.comFerr-0.005?`<div class="est-alert bad">Com essa tabela, o dia a dia (${brlE(E.alvo)}) fica abaixo do preço com ferramentas. O desconto do dia a dia pode ser no máximo ${pctE(E.dmax,1)}.</div>`
     :E.alvo<E.alvoCalc-0.005?`<div class="est-alert warn">Com essa tabela, o dia a dia (${brlE(E.alvo)}) já usa parte da reserva. Tabela sugerida: ${brlE(E.tabSug)}.</div>`:''}`;
  // Taxas da plataforma (lado esquerdo), com o valor em R$ no preço simulado
  const tx=document.getElementById('est-taxas');
  if(tx&&S){
    const grupos=['plat','imp','mkt'];
    tx.innerHTML=grupos.map(g=>{const ls=S.L.filter(x=>x.cat===g&&!x.res&&!x.sobra);if(!ls.length)return'';
      return`<div class="est-grp">${CAT_LABEL[g]}</div>`+ls.map(x=>`<div class="taxa-detail-row"><span style="color:var(--text2)">${escH(x.n)}</span><span><span style="color:var(--text3);font-size:10px;margin-right:6px">${x.rate!=null?pctE(x.rate):''}</span><span class="calc-val">${brlE(x.val)}</span></span></div>`).join('');}).join('')
      +`<div class="est-muted" style="margin-top:4px">Valores em R$ no preço simulado (${brlE(S.P)}).</div>`;
  }
  if(!S) return;
  // Detalhamento agrupado
  const det=document.getElementById('est-det');
  const linha=x=>`<tr${x.sobra?' class="est-sobra"':''}><td>${escH(x.n)}${x.temReserva?` <span style="color:var(--accent-text);font-size:11px">+ ${x.extra.join(' + ')} da reserva</span>`:''}</td><td class="pc">${pctE(x.rate!=null?x.rate:(S.P?x.val/S.P:0))}</td><td class="num">${brlE(x.val)}</td></tr>`;
  det.innerHTML=`<table class="est-det">${['plat','imp','mkt'].map(g=>{const ls=S.L.filter(x=>x.cat===g);if(!ls.length)return'';return`<tr class="grp"><td colspan="3">${CAT_LABEL[g]}</td></tr>`+ls.map(linha).join('');}).join('')}
    <tr class="sub"><td>Total de taxas</td><td class="pc">${pctE(S.taxas/S.P)}</td><td class="num neg">${brlE(S.taxas)}</td></tr>
    <tr><td>Preço de venda</td><td class="pc">${pctE(1)}</td><td class="num">${brlE(S.P)}</td></tr>
    <tr><td>Custo de compra</td><td class="pc">${pctE(E.custo/S.P)}</td><td class="num">${brlE(E.custo)}</td></tr>
    <tr class="sub"><td>Total geral (taxas + custo)</td><td class="pc">${pctE(S.total/S.P)}</td><td class="num neg">${brlE(S.total)}</td></tr></table>`;
  // Resultado
  let cls,txt;
  if(S.lucro<-0.005){cls='bad';txt='Prejuízo';}
  else if(S.passou){cls='warn';txt=S.usado>0?'Passou da reserva · comendo a margem':'Abaixo da margem mínima';}
  else if(S.usado>0){cls='ok';txt=`Usando ${brlE(S.usado)} da reserva · sobra ${brlE(S.sobra)}`;}
  else{cls='ok';txt=S.sobra>0?'Margem + reserva intactas':'Na margem mínima';}
  document.getElementById('est-res').innerHTML=`<div class="est-result ${cls}">
    <div class="ln"><span>Preço de tabela</span><s>${brlE(E.tab)}</s></div>
    <div class="ln"><b>Cliente paga</b><b class="mono">${brlE(S.P)}</b></div>
    <div class="lbl">Reserva de marketing</div>
    <div class="ln"><span>Reserva neste preço</span><span class="mono">${brlE(S.totR)}</span></div>
    <div class="ln"><span>Usado (lançamentos${parseFloat(ST.calc.extra)?' + simulação':''})</span><span class="mono">− ${brlE(S.usado)}</span></div>
    <div class="ln"><b>Sobra na reserva</b><b class="mono">${brlE(S.sobra)}</b></div>
    <div class="lbl">Lucro por peça</div>
    <div class="big">${brlE(S.lucro)}</div>
    <div class="ln"><span>${pctE(S.lp)} · margem mínima ${pctE(E.margem,1)}</span><span class="mono">${E.kit?brlE(S.lucro/E.kit)+'/peça':''}</span></div>
    <span class="pill">${txt}</span>
  </div>`;
}

async function estSalvar(){
  const E=estCalcular();if(!E||!E.p||!E.k){toast('Escolha o SKU e o kit','error');return;}
  if(!isFinite(E.tab)||!isFinite(E.piso)){toast('Não foi possível calcular — confira custo e taxas','error');return;}
  if(!E.k.estrategia) E.k.estrategia={};
  E.k.estrategia[E.pl]={piso:E.piso,com_ferramentas:E.comFerr,alvo:E.alvo,tabela:E.tab,tabela_manual:!!E.tabMan,
    desconto:Math.round(E.desc*1000)/10,reserva:Math.round(E.reserva*10000)/100,margem:Math.round(E.margem*10000)/100,
    margem_manual:E.margemManual,custo:E.custo,salvo_em:new Date().toISOString()};
  try{await saveProduct(E.p,E.c.id);}catch(err){toast('⚠️ ERRO ao salvar: '+(err.message||'falha'),'error');return;}
  toast('✅ Estratégia salva — veja na aba 🎯 Estratégias');renderTab();
}

function renderKitBlock(k,i,plats,prod){
  // Ordem SEMPRE fixa, independente da ordem de seleção
  const platsOrdenadas=PLATS.filter(p=>plats.includes(p.id));
  const hasML=plats.some(pl=>pl==='ml_classico'||pl==='ml_premium');
  const tipoProd=tipoDoProduto(prod);
  // Cores dos chips por plataforma
  const platColors={shopee:'#9d2a0a',shein:'#065f46',ml_classico:'#713f12',ml_premium:'#713f12',tiktok:'#334155'};
  const platBgs={shopee:'#fee2d5',shein:'#d1fae5',ml_classico:'#fef9c3',ml_premium:'#fef9c3',tiktok:'#f1f5f9'};
  return`<div class="kit-block"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;flex-wrap:wrap">
      Kit <input type="number" class="form-input" style="width:65px" value="${k.qty||''}" min="1" placeholder="qtd" onchange="ST.modal.p.kits[${i}].qty=parseInt(this.value)||null"/> peças
      ${hasML?`<span style="font-size:11px;color:var(--text3)">Peso ML:</span><input type="number" class="form-input" style="width:70px" value="${k.peso_kg||''}" min="0" step="0.1" placeholder="0.0" onchange="ST.modal.p.kits[${i}].peso_kg=parseFloat(this.value)||0"/> kg`:''}
    </div>
    <button class="btn-icon danger" onclick="rmKit(${i})">🗑️</button>
  </div>
  ${platsOrdenadas.length===0?`<div style="font-size:11px;color:var(--text3);text-align:center">Selecione plataformas primeiro</div>`:`
    <div style="display:grid;grid-template-columns:70px repeat(${platsOrdenadas.length},1fr);gap:5px;align-items:center;font-size:11px">
      <div></div>${platsOrdenadas.map(po=>`<div style="text-align:center;font-weight:700;font-size:10px;padding:3px 6px;border-radius:20px;background:${platBgs[po.id]||'var(--surface2)'};color:${platColors[po.id]||'var(--text2)'}">${po.label}</div>`).join('')}
      <div style="color:var(--text3);font-weight:500">Preço Atual</div>${platsOrdenadas.map(po=>`<input type="number" class="form-input" style="font-size:11px;padding:5px" placeholder="0.00" step="0.01" data-kit="${i}" data-plat="${po.id}" data-tipo="precos" value="${k.precos?.[po.id]||''}" oninput="onKitInput(${i},'precos','${po.id}',this.value)" onblur="formatMoneyInput(this)"/>`).join('')}
      <div style="color:var(--text3);font-weight:500" title="Calculado automaticamente com base na margem ideal configurada em Config">Preço Ideal</div>${platsOrdenadas.map(po=>{
        const c=gc();
        const custo=k.custos?.[po.id];
        const ideal=(c&&custo)?calcPrecoIdeal(custo,po.id,c.taxas,k.peso_kg||0,k.qty||1,c,getCurvaProduto(prod,po.id,k.qty),tipoProd):null;
        return`<div id="ideal-${i}-${po.id}" style="text-align:center;font-family:inherit;font-weight:400;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:5px;font-size:11px">${ideal?`R$${ideal.preco.toFixed(2)} <span style="font-size:9px;color:var(--text3)">(${ideal.margemPerc.toFixed(0)}%)</span>`:'—'}</div>`;
      }).join('')}
      <div style="color:var(--text3);font-weight:500">Custo</div>${platsOrdenadas.map(po=>`<input type="number" class="form-input" style="font-size:11px;padding:5px" placeholder="0.00" step="0.01" data-kit="${i}" data-plat="${po.id}" data-tipo="custos" value="${k.custos?.[po.id]||''}" oninput="onKitInput(${i},'custos','${po.id}',this.value)" onblur="formatMoneyInput(this)"/>`).join('')}
    </div>
    <div id="kit-preview-${i}">${renderLucroPreviewHTML(k,platsOrdenadas.map(p=>p.id),prod,tipoProd)}</div>`}
  </div>`;
}
function renderLucroPreviewHTML(k,plats,prod,tipoProduto){
  const c=gc();if(!c) return'';
  const rows=plats.map(pl=>{
    const preco=k.precos?.[pl];const custo=k.custos?.[pl];
    if(!preco||!custo) return null;
    const r=calcR(preco,custo,pl,c.taxas,k.peso_kg||0,k.qty||1);
    if(!r) return null;
    const po=PLATS.find(x=>x.id===pl);
    const co=cor(r,k.qty||1,c,getCurvaProduto(prod,pl,k.qty),tipoProduto,pl);
    const prej=r.lucro<0;
    const color=co==='g'?'var(--success)':'var(--danger)';
    const bg=co==='g'?'var(--success-bg)':'var(--danger-bg)';
    return`<div class="lucro-preview" style="background:${bg};border-color:${color};flex:1;min-width:100px">
      <div style="font-size:10px;opacity:.8;margin-bottom:3px">${po?.label||pl}${prej?' ⚠️':''}</div>
      <div style="font-weight:700;font-family:var(--mono);color:${color}">R$ ${r.lucro.toFixed(2)}</div>
      <div style="font-size:10px;opacity:.8;color:${color}">${r.margem.toFixed(1)}% · R$${(r.lucro/(k.qty||1)).toFixed(2)}/pç</div>
    </div>`;
  }).filter(Boolean);
  return rows.length?`<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)">
    <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Lucro calculado</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${rows.join('')}</div>
  </div>`:'';
}

async function duplicarCliente(id){
  const cl=ST.clients.find(c=>c.id===id);if(!cl)return;
  if(!confirm(`Duplicar "${cl.name}" com todos os produtos e configurações?`))return;
  toast('Duplicando...');
  const novoNome=cl.name+' (cópia)';
  const color=COLORS[(ST.clients.length)%COLORS.length];
  // Criar novo cliente com mesmas configs
  const{data:novoCliente,error:e1}=await sb.from('prec_clients').insert({
    name:novoNome,color,taxas:cl.taxas,
    margem_por_curva:cl.margem_por_curva,status_por_plataforma:cl.status_por_plataforma,plataformas_desativadas:cl.plataformas_desativadas
  }).select().single();
  if(e1){toast('Erro ao duplicar cliente','error');return;}
  // Duplicar todos os produtos
  const prods=(cl.produtos||[]).map(p=>({
    client_id:novoCliente.id,sku:p.sku,nome:p.nome,fabricacao:p.fabricacao||false,
    plataformas:p.plataformas,kits:p.kits,foto_url:p.foto_url||null,links:p.links||{}
  }));
  if(prods.length){
    for(let i=0;i<prods.length;i+=50){
      const{error:e2}=await sb.from('prec_products').insert(prods.slice(i,i+50));
      if(e2){toast('Erro ao duplicar produtos','error');return;}
    }
  }
  // Recarregar dados
  await loadAll();
  ST.activeId=novoCliente.id;ST.tab='dashboard';
  toast(`✅ "${novoNome}" criado com ${prods.length} produtos!`);render();
}
async function excluirCliente(id){
  const cl=ST.clients.find(c=>c.id===id);if(!cl)return;
  if(!confirm(`⚠️ Excluir "${cl.name}" permanentemente?\n\nIsso vai apagar:\n• ${(cl.produtos||[]).length} produtos\n• Todas as taxas e configurações\n• Todos os extratos de curva ABC\n\nEssa ação não pode ser desfeita!`))return;
  if(!confirm(`Tem certeza? Digite OK para confirmar a exclusão de "${cl.name}".`))return;
  toast('Excluindo...');
  // Excluir produtos, histórico, curva ABC e o cliente
  await sb.from('prec_historico').delete().eq('client_id',id);
  await sb.from('prec_curva_abc').delete().eq('client_id',id);
  await sb.from('prec_products').delete().eq('client_id',id);
  const{error}=await sb.from('prec_clients').delete().eq('id',id);
  if(error){toast('Erro ao excluir: '+error.message,'error');return;}
  ST.clients=ST.clients.filter(c=>c.id!==id);
  ST.activeId=ST.clients[0]?.id||null;
  ST.tab='dashboard';
  toast('✅ Loja excluída com sucesso.');render();
}
async function saveNewClient(){

async function aplicarPlataformaEmTodosProdutos(platId){
  const c=gc();if(!c)return;
  const po=PLATS.find(x=>x.id===platId);
  const alvos=(c.produtos||[]).filter(p=>!(p.plataformas||[]).includes(platId));
  if(!alvos.length){toast('Todos os produtos já têm essa plataforma','error');return;}
  toast(`Atualizando ${alvos.length} produto(s)...`);
  let ok=0,semCusto=0;
  for(const p of alvos){
    const produtoAntigo=JSON.parse(JSON.stringify(p));
    if(!p.plataformas) p.plataformas=[];
    p.plataformas.push(platId);
    const{valor:custoUnit}=inferCustoUnitario(p);
    const curva=getCurvaProduto(p,platId);
    const tipoP=tipoDoProduto(p);
    let algumCusto=false;
    (p.kits||[]).forEach(k=>{
      if(!k.qty) return;
      if(!k.custos) k.custos={};
      if(!k.precos) k.precos={};
      if(custoUnit){
        const custoKit=Math.round(custoUnit*k.qty*100)/100;
        k.custos[platId]=custoKit;
        algumCusto=true;
        // Preço já vem sugerido pela meta de margem configurada — evita ter que digitar do zero
        const ideal=calcPrecoIdeal(custoKit,platId,c.taxas,k.peso_kg||0,k.qty,c,curva,tipoP);
        if(ideal) k.precos[platId]=ideal.preco;
      }
    });
    if(!algumCusto) semCusto++;
    try{
      await saveProduct(p,c.id,produtoAntigo);
      ok++;
    }catch(err){
      console.error('Erro ao adicionar plataforma no produto',p.sku,err);
    }
  }
  renderTab();
  toast(`✅ ${po?.label||platId} adicionado em ${ok} produto(s)${semCusto?` (${semCusto} sem custo cadastrado ainda)`:''} — já com preço sugerido`);
}

function startInlineEditPreco(span,pid,cid,plat,kitQty,valorSugerido){
  const cli=ST.clients.find(c=>String(c.id)===String(cid));
  const p=cli?.produtos?.find(x=>String(x.id)===String(pid));
  if(!p)return;
  const k=p.kits.find(x=>x.qty===kitQty);
  if(!k)return;
  const valorAtual=k.precos?.[plat]||valorSugerido||0;
  const input=document.createElement('input');
  input.type='number';input.step='0.01';input.className='preco-inline-input';input.value=valorAtual;
  span.replaceWith(input);input.focus();input.select();

  const cardEl=document.getElementById(`kitcard-${pid}-${plat}-${kitQty}`);
  const curvaP=getCurvaProduto(p,plat,kitQty);
  const tipoP=tipoDoProduto(p);

  // Atualiza só os valores internos do card via IDs específicos — nunca recria o card nem o input
  const atualizarCardAoVivo=()=>{
    const novoValor=parseFloat(input.value);
    if(!cardEl||isNaN(novoValor)||novoValor<=0) return;
    const KC=kitCalc(p,cli,plat,k,novoValor);if(!KC) return;const r2=KC.r2;estAtualizarReservaAoVivo(cardEl,k,plat,novoValor,KC);
    const co2=cor(r2,k.qty,cli,curvaP,tipoP,plat);
    const prej=r2.lucro<0;
    const lucroColor=co2==='g'?'var(--success)':'var(--danger)';
    const setText=(id,txt)=>{const el=cardEl.querySelector(`[data-f="${id}"]`);if(el)el.textContent=txt;};
    const setColor=(id,color)=>{const el=cardEl.querySelector(`[data-f="${id}"]`);if(el)el.style.color=color;};
    // Preço Ideal (comparação)
    const ideal=idealDoKit(r2.custo,plat,cli,k,curvaP,tipoP);
    if(ideal){
      const diff=r2.preco-ideal.preco;
      const diffColor=Math.abs(diff)<0.01?'var(--text3)':diff<0?'var(--danger)':'var(--success)';
      setText('ideal-diff',`(${diff>=0?'+':''}${diff.toFixed(2)})`);
      setColor('ideal-diff',diffColor);
    }
    // Taxas percentuais e fixas (na ordem em que aparecem)
    cardEl.querySelectorAll('[data-perctax]').forEach((el,idx)=>{
      const d=r2.percDetail[idx];if(d)el.textContent='R$'+d.val.toFixed(2);
    });
    cardEl.querySelectorAll('[data-fixtax]').forEach((el,idx)=>{
      const d=r2.fixaDetail[idx];if(d)el.textContent='R$'+d.val.toFixed(2);
    });
    setText('total-taxas',`R$${r2.tax.toFixed(2)}`);
    setText('lucro-rs',`R$${r2.lucro.toFixed(2)}`);
    setText('lucro-rs-label',`${prej?'⚠️ ':''}LUCRO EM R$`);
    setText('lucro-pc',`${r2.margem.toFixed(2)}%`);
    setText('lucro-peca',`R$${(r2.lucro/k.qty).toFixed(2)}`);
    setColor('lucro-rs',lucroColor);
    setColor('lucro-rs-label',lucroColor);
    setColor('lucro-pc',lucroColor);
    setColor('lucro-peca',lucroColor);
    setColor('total-taxas','var(--danger)');
    // Atualiza fundo do box de lucro
    const lucroBox=cardEl.querySelector('[data-f="lucro-box"]');
    if(lucroBox){
      const bg=co2==='g'?'var(--success-bg)':'var(--danger-bg)';
      lucroBox.style.background=bg;
    }
  };
  input.addEventListener('input',atualizarCardAoVivo);

  const finalizar=async(salvar)=>{
    input.removeEventListener('input',atualizarCardAoVivo);
    if(salvar){
      const novoValor=parseFloat(input.value)||0;
      await saveInlineEditPreco(pid,cid,plat,kitQty,novoValor);
    }
    renderTab();
  };
  input.addEventListener('blur',()=>finalizar(true));
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();input.blur();}
    if(e.key==='Escape'){e.preventDefault();input.removeEventListener('blur',()=>finalizar(true));finalizar(false);}
  });
}

    });

    });
